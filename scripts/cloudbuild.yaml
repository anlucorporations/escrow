# ============================================================================
# TrueKeate — Cloud Build (Cloud Run, imagen web)
# ============================================================================
# Contexto de build: web/  →  gcloud builds submit --config scripts/cloudbuild.yaml \
#     --substitutions=_ESCROW=0x...,_REGISTRY=0x...,... web/
# Las direcciones NEXT_PUBLIC_* se hornean en el bundle del cliente.
# Los secretos NO: se inyectan en runtime con --set-secrets.
#
# IMPORTANTE: los nombres de las variables deben coincidir EXACTAMENTE con los
# `ARG` declarados en web/Dockerfile y con los que lee web/lib/contracts.ts.
# Un --build-arg sin ARG correspondiente solo produce un aviso y el valor nunca
# llega al bundle (era el fallo de la versión anterior de este archivo).
# ============================================================================
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_ESCROW=$_ESCROW'
      - '--build-arg'
      - 'NEXT_PUBLIC_FACTORY=$_FACTORY'
      - '--build-arg'
      - 'NEXT_PUBLIC_BRLT=$_BRLT'
      - '--build-arg'
      - 'NEXT_PUBLIC_REGISTRY=$_REGISTRY'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUSCRIPCION=$_SUSCRIPCION'
      - '--build-arg'
      - 'NEXT_PUBLIC_CHAIN_ID=$_CHAIN_ID'
      - '--build-arg'
      - 'NEXT_PUBLIC_RPC_URL=$_RPC_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_TRUEKE_NFT=$_TRUEKE_NFT'
      - '--build-arg'
      - 'NEXT_PUBLIC_TRUEKE_SBT=$_TRUEKE_SBT'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/truekeate-repo/web:$_TAG'
      - '.'

# Valores por defecto = despliegue GCP vigente. Se pueden sobrescribir con
# --substitutions al lanzar el build.
substitutions:
  _ESCROW: '0x8a93d247134d91e0de6f96547cb0204e5be8e5d8'
  _FACTORY: '0x40918ba7f132e0acba2ce4de4c4baf9bd2d7d849'
  _BRLT: '0x6f6f570f45833e249e27022648a26f4076f48f78'
  _REGISTRY: '0xb0f05d25e41fbc2b52013099ed9616f1206ae21b'
  _SUSCRIPCION: '0x5feaebfb4439f3516c74939a9d04e95afe82c4ae'
  _CHAIN_ID: '31337'
  _RPC_URL: 'https://mcc-foundry-anvil-slzlptbcla-ew.a.run.app'
  _API_URL: 'https://truekeate-api-593453426217.europe-west1.run.app'
  _TRUEKE_NFT: '0x6C2d83262fF84cBaDb3e416D527403135D757892'
  _TRUEKE_SBT: '0x870526b7973b56163a6997bB7C886F5E4EA53638'
  # Etiqueta de la imagen: se pasa el commit corto (convención release-<sha>).
  _TAG: 'latest'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/truekeate-repo/web:$_TAG'

options:
  logging: CLOUD_LOGGING_ONLY
