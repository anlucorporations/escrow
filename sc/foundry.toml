[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

# Remappings de dependencias
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# Perfil de fuzzing (forge test)
[profile.default.fuzz]
runs = 256

# Perfil de invariantes (handler-based, RNF-04.1)
[profile.default.invariant]
runs = 64
depth = 100
fail_on_revert = false
