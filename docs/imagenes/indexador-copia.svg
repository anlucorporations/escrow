<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">El vigilante copia los eventos a la base de datos</text>

  <!-- Blockchain group -->
  <rect x="40" y="90" width="220" height="300" rx="16" fill="#fff1f0" stroke="#e63946" stroke-width="2"/>
  <text x="150" y="118" text-anchor="middle" fill="#a8232d" font-size="14" font-weight="bold">Blockchain</text>
  <text x="150" y="136" text-anchor="middle" fill="#a8232d" font-size="10">fuente de verdad</text>
  <g>
    <rect x="60" y="160" width="180" height="56" rx="10" fill="#e63946"/>
    <text x="150" y="184" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Evento</text>
    <text x="150" y="201" text-anchor="middle" fill="#ffffff" font-size="10">Trueke 42 -&gt; CUSTODIADO</text>
  </g>
  <g>
    <rect x="60" y="235" width="180" height="56" rx="10" fill="#e63946"/>
    <text x="150" y="259" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Evento</text>
    <text x="150" y="276" text-anchor="middle" fill="#ffffff" font-size="10">Ana admitida como SOCIO</text>
  </g>
  <g>
    <rect x="60" y="310" width="180" height="56" rx="10" fill="#e63946"/>
    <text x="150" y="334" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Evento</text>
    <text x="150" y="351" text-anchor="middle" fill="#ffffff" font-size="10">TruekeCompletado</text>
  </g>

  <!-- Arrows from events to indexer -->
  <g stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="242" y1="188" x2="288" y2="188"/>
    <line x1="242" y1="263" x2="288" y2="263"/>
    <line x1="242" y1="338" x2="288" y2="338"/>
  </g>
  <text x="265" y="300" fill="#1a2b4c" font-size="10" transform="rotate(-90 265 300)" text-anchor="middle">lee eventos</text>

  <!-- Indexador group -->
  <rect x="300" y="90" width="200" height="300" rx="16" fill="#e8f6fb" stroke="#1d7fa8" stroke-width="2"/>
  <text x="400" y="118" text-anchor="middle" fill="#1d7fa8" font-size="14" font-weight="bold">Vigilante</text>
  <text x="400" y="136" text-anchor="middle" fill="#1d7fa8" font-size="10">indexador</text>
  <rect x="318" y="160" width="164" height="210" rx="12" fill="#48cae4"/>
  <text x="400" y="190" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">Escucha eventos</text>
  <text x="400" y="232" text-anchor="middle" fill="#0a1128" font-size="11">1. Anota que</text>
  <text x="400" y="248" text-anchor="middle" fill="#0a1128" font-size="11">ya lo vio</text>
  <text x="400" y="290" text-anchor="middle" fill="#0a1128" font-size="11">2. Copia el cambio</text>
  <text x="400" y="330" text-anchor="middle" fill="#0a1128" font-size="11">3. Guarda</text>
  <text x="400" y="346" text-anchor="middle" fill="#0a1128" font-size="11">checkpoint</text>

  <!-- Arrows indexador -> BD -->
  <g stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="502" y1="210" x2="548" y2="210"/>
    <line x1="502" y1="290" x2="548" y2="290"/>
  </g>
  <text x="525" y="190" fill="#1a2b4c" font-size="10" text-anchor="middle">escribe</text>
  <text x="525" y="252" fill="#1a2b4c" font-size="10" text-anchor="middle">copias</text>

  <!-- BD group -->
  <rect x="560" y="90" width="210" height="300" rx="16" fill="#e6f4f2" stroke="#1f6f64" stroke-width="2"/>
  <text x="665" y="118" text-anchor="middle" fill="#1f6f64" font-size="14" font-weight="bold">Base de datos</text>
  <text x="665" y="136" text-anchor="middle" fill="#1f6f64" font-size="10">copias rapidas</text>
  <g>
    <rect x="578" y="160" width="174" height="72" rx="10" fill="#2a9d8f"/>
    <text x="665" y="185" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Tabla truekes</text>
    <text x="665" y="202" text-anchor="middle" fill="#ffffff" font-size="10">estado actualizado</text>
    <text x="665" y="219" text-anchor="middle" fill="#ffffff" font-size="10">espejo del escrow</text>
  </g>
  <g>
    <rect x="578" y="250" width="174" height="72" rx="10" fill="#2a9d8f"/>
    <text x="665" y="275" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Tabla usuarios</text>
    <text x="665" y="292" text-anchor="middle" fill="#ffffff" font-size="10">tipo = SOCIO</text>
    <text x="665" y="309" text-anchor="middle" fill="#ffffff" font-size="10">huella verificada</text>
  </g>
  <g>
    <rect x="578" y="340" width="174" height="36" rx="10" fill="#1a2b4c"/>
    <text x="665" y="363" text-anchor="middle" fill="#f3e5ab" font-size="10.5" font-weight="bold">auditoria: bitacora</text>
  </g>

  <!-- Bottom note -->
  <rect x="60" y="420" width="680" height="44" rx="12" fill="#f3e5ab"/>
  <text x="400" y="439" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">Si el vigilante se cae o se pierde un evento, se reprocesa</text>
  <text x="400" y="455" text-anchor="middle" fill="#0a1128" font-size="11">releyendo la blockchain desde un bloque anterior: los eventos tienen numero de serie unico y nunca se duplican</text>
</svg>
