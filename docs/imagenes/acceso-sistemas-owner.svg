<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="sans-serif"><defs><marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e63946"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a9d8f"/></marker></defs><rect width="1200" height="880" fill="#f8f9fa"/><rect width="1200" height="58" fill="#1a2b4c"/><rect y="54" width="1200" height="4" fill="#d4af37"/><text x="600" y="28" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Sistemas / Panel del Owner: solo entra la billetera Owner on-chain</text><text x="600" y="46" font-size="10.5" font-weight="normal" fill="#c9d8f0" text-anchor="middle">aunque alguien sea SOCIO en la base de datos, no ve esta sección</text><rect x="410" y="90" width="380" height="64" rx="14" fill="#48cae4" stroke="#1d7fa8" stroke-width="1.4" data-card="1" data-cx="600" data-cy="122" data-w="380" data-h="64"/><text x="600" y="124.4" font-size="14.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="364">Usuario conectado</text><text x="600" y="140.9" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="364">billetera + sesión iniciada</text><path d="M 600 154 L 600 213" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><polygon points="600,211 805,285 600,359 395,285" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.6" data-card="1" data-cx="600" data-cy="285" data-hw="205" data-hh="74"/><text x="600" y="274.4" font-size="11.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="380">¿La billetera conectada es el Owner real?</text><text x="600" y="289.2" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="380">= owner() del registro de Socios</text><text x="600" y="303.1" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="380">(verificado on-chain · SociosRegistry)</text><rect x="35" y="405" width="410" height="191" rx="16" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.4" data-card="1"/><text x="240" y="449" font-size="15.5" font-weight="bold" fill="#8d1f2d" text-anchor="middle" data-in="1" data-mw="384">✗ Sin acceso a Sistemas</text><text x="240" y="479" font-size="11.5" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="384">aunque su tipo en la base sea SOCIO</text><text x="240" y="509" font-size="11.5" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="384">no ve el icono en la barra superior</text><text x="240" y="539" font-size="11.5" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="384">y /suite/admin lo bloquea (portero)</text><text x="240" y="569" font-size="10.5" font-weight="normal" fill="#8d1f2d" text-anchor="middle" data-in="1" data-mw="384">el backend responde 403 · solo_owner</text><path d="M 395 285 L 240 285 L 240 405" fill="none" stroke="#e63946" stroke-width="2.4" marker-end="url(#arrR)"/><text x="250" y="350" font-size="10.5" font-weight="bold" fill="#8d1f2d" text-anchor="start" data-out="1">No (aunque sea SOCIO)</text><rect x="740" y="344" width="400" height="112" rx="14" fill="#d4af37" stroke="#8a6d1f" stroke-width="1.4" data-card="1" data-cx="940" data-cy="400" data-w="400" data-h="112"/><text x="940" y="394.1" font-size="13.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="384">Aparece el icono de Sistemas</text><text x="940" y="410.8" font-size="11.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="384">en la barra superior</text><text x="940" y="425.6" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="384">(esOwner: solo tu billetera)</text><path d="M 800 285 L 900 285 L 900 344" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="908" y="320" font-size="10.5" font-weight="bold" fill="#1f6f64" text-anchor="start" data-out="1">Sí: es el Owner real (owner())</text><rect x="740" y="493" width="400" height="104" rx="14" fill="#1a2b4c" stroke="#0a1128" stroke-width="1.4" data-card="1" data-cx="940" data-cy="545" data-w="400" data-h="104"/><text x="940" y="539.1" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="384">Entras al Panel del Owner</text><text x="940" y="556.5" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="384">/suite/admin · Sistemas</text><text x="940" y="571.5" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="384">cifras · KYC · contratos · servidores</text><path d="M 940 456 L 940 493" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><rect x="740" y="634" width="400" height="132" rx="14" fill="#2a9d8f" stroke="#1f6f64" stroke-width="1.4" data-card="1" data-cx="940" data-cy="700" data-w="400" data-h="132"/><text x="940" y="686.2" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="384">Servicios /admin + revisión KYC</text><text x="940" y="702.8" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="384">aceptan tu sesión de Owner on-chain</text><text x="940" y="718.2" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="384">descargas: Biblioteca de Sistemas (PDF)</text><text x="940" y="733.4" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="384">otra billetera → 403 · solo_owner</text><path d="M 940 597 L 940 634" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><rect x="60" y="806" width="1080" height="64" rx="14" fill="#1a2b4c" data-card="1"/><text x="600" y="830" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="1040">La verdad del Owner la decide la CADENA: el owner() del registro de Socios (SociosRegistry)</text><text x="600" y="851" font-size="10.5" font-weight="normal" fill="#f3e5ab" text-anchor="middle" data-in="1" data-mw="1040">Ana y Bruno figuran como SOCIO en la base y, aun así, no ven Sistemas</text></svg>