<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#e63946"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Importar una cuenta de prueba en tu billetera</text>

  <!-- Pasos -->
  <rect x="80" y="64" width="480" height="46" rx="12" fill="#f4a261"/>
  <text x="320" y="91" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">1 · Elige una cuenta de prueba (ej. Ana, n.º 2)</text>

  <rect x="80" y="126" width="480" height="46" rx="12" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
  <text x="320" y="146" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">2 · Copia su clave privada de la tabla</text>
  <text x="320" y="164" text-anchor="middle" fill="#1a2b4c" font-size="10">Ana: 0x5de4111afa1a4b94908f83103eb1f170…</text>

  <rect x="80" y="188" width="480" height="52" rx="12" fill="#48cae4"/>
  <text x="320" y="212" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">3 · MetaMask: icono de perfil → Importar cuenta</text>
  <text x="320" y="231" text-anchor="middle" fill="#0a1128" font-size="10">(Añadir cuenta o cuenta de hardware)</text>

  <rect x="80" y="256" width="480" height="46" rx="12" fill="#48cae4"/>
  <text x="320" y="283" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">4 · Tipo: «Clave privada» y pega la clave</text>

  <rect x="80" y="318" width="480" height="46" rx="12" fill="#48cae4"/>
  <text x="320" y="345" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">5 · Pulsa «Importar»</text>

  <!-- Decision -->
  <rect x="80" y="380" width="480" height="56" rx="12" fill="#f3e5ab" stroke="#c5a065" stroke-width="2"/>
  <text x="320" y="408" text-anchor="middle" fill="#1a2b4c" font-size="13" font-weight="bold">6 · Comprueba la dirección resultante:</text>
  <text x="320" y="427" text-anchor="middle" fill="#1a2b4c" font-size="11.5">¿coincide con la de la tabla del manual?</text>

  <!-- Error (no) -->
  <rect x="610" y="380" width="170" height="56" rx="12" fill="#e63946"/>
  <text x="695" y="400" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">No coincide</text>
  <text x="695" y="416" text-anchor="middle" fill="#ffffff" font-size="9.5">revisa que pegaste la clave</text>
  <text x="695" y="429" text-anchor="middle" fill="#ffffff" font-size="9.5">completa y sin espacios</text>

  <!-- Resultado OK -->
  <rect x="80" y="452" width="480" height="44" rx="12" fill="#2a9d8f"/>
  <text x="320" y="470" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">7 · Abre la web y pulsa «Conectar e iniciar sesión»</text>
  <text x="320" y="489" text-anchor="middle" fill="#ffffff" font-size="10.5">¡Ya operas como Ana en la red de pruebas!</text>

  <!-- Flechas -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="320" y1="110" x2="320" y2="122"/>
    <line x1="320" y1="172" x2="320" y2="184"/>
    <line x1="320" y1="240" x2="320" y2="252"/>
    <line x1="320" y1="302" x2="320" y2="314"/>
    <line x1="320" y1="364" x2="320" y2="376"/>
    <line x1="560" y1="408" x2="606" y2="408"/>
    <line x1="320" y1="436" x2="320" y2="448"/>
  </g>
  <text x="583" y="400" text-anchor="middle" fill="#e63946" font-size="10.5" font-weight="bold">no</text>
  <text x="330" y="446" fill="#2a9d8f" font-size="10.5" font-weight="bold">sí</text>

  <!-- Bucle de reintento: vuelve al paso 3 -->
  <g stroke="#e63946" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)">
    <path d="M 695 380 L 695 214 L 563 214"/>
  </g>
  <text x="706" y="300" fill="#e63946" font-size="10" font-weight="bold">vuelve al paso 3</text>
</svg>
