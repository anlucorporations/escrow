<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Ciclo de suscripcion de empresa (30 dias)</text>

  <!-- SUB -->
  <rect x="240" y="78" width="320" height="60" rx="13" fill="#48cae4"/>
  <text x="400" y="102" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">1. La empresa se suscribe</text>
  <text x="400" y="120" text-anchor="middle" fill="#0a1128" font-size="10.5">bloquea 100 BRLT (30 dias) · ACTIVA</text>

  <!-- Cancelar -->
  <rect x="620" y="80" width="150" height="52" rx="12" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
  <text x="695" y="101" text-anchor="middle" fill="#1a2b4c" font-size="11" font-weight="bold">Cancelar</text>
  <text x="695" y="117" text-anchor="middle" fill="#1a2b4c" font-size="9.5">siempre que este ACTIVA</text>
  <path d="M 562 106 L 616 106" stroke="#1a2b4c" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="590" y="98" text-anchor="middle" fill="#1a2b4c" font-size="9">la empresa cancela</text>
  <rect x="620" y="150" width="150" height="44" rx="12" fill="#e2e8f0"/>
  <text x="695" y="168" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold">Se devuelven los</text>
  <text x="695" y="184" text-anchor="middle" fill="#1a2b4c" font-size="10">100 BRLT · CANCELADA</text>
  <line x1="695" y1="134" x2="695" y2="146" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MES -->
  <rect x="240" y="175" width="320" height="58" rx="13" fill="#2a9d8f"/>
  <text x="400" y="200" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">2. Vence el mes</text>
  <text x="400" y="218" text-anchor="middle" fill="#ffffff" font-size="10.5">el vigilante recolecta el ciclo</text>

  <!-- Split -->
  <g>
    <rect x="60" y="280" width="300" height="86" rx="13" fill="#d4af37"/>
    <text x="210" y="306" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">3a. 10% = 10 BRLT</text>
    <text x="210" y="326" text-anchor="middle" fill="#0a1128" font-size="11">van al Fondo de Valor</text>
    <text x="210" y="346" text-anchor="middle" fill="#0a1128" font-size="10.5">(hucha comun)</text>
  </g>
  <g>
    <rect x="440" y="280" width="300" height="86" rx="13" fill="#1a2b4c"/>
    <text x="590" y="306" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">3b. 90% = 90 BRLT</text>
    <text x="590" y="326" text-anchor="middle" fill="#f3e5ab" font-size="11">se quedan en el contrato</text>
    <text x="590" y="346" text-anchor="middle" fill="#ffffff" font-size="10.5">fondos de operacion</text>
  </g>

  <!-- RE -->
  <rect x="240" y="405" width="320" height="50" rx="13" fill="#2a9d8f"/>
  <text x="400" y="427" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">4. Se reinicia el ciclo</text>
  <text x="400" y="444" text-anchor="middle" fill="#ffffff" font-size="10.5">otros 30 dias, sin nueva firma</text>

  <!-- Arrows -->
  <line x1="400" y1="140" x2="400" y2="171" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M 320 235 L 235 276"/>
    <path d="M 480 235 L 565 276"/>
    <path d="M 210 368 L 330 401"/>
    <path d="M 590 368 L 470 401"/>
    <!-- loop back RE -> MES -->
    <path d="M 240 430 L 40 430 L 40 204 L 236 204"/>
  </g>
  <text x="210" y="262" fill="#8a6d1f" font-size="10" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="3">10% al fondo</text>
  <text x="520" y="262" fill="#1a2b4c" font-size="10" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="3">90% operacion</text>
  <text x="300" y="470" fill="#1a2b4c" font-size="9.5">nuevo ciclo (vuelve al paso 2)</text>

  <!-- Note -->
  <rect x="60" y="478" width="680" height="18" rx="8" fill="#f3e5ab"/>
  <text x="400" y="491" text-anchor="middle" fill="#0a1128" font-size="8.5" font-weight="bold">Pendiente: el paso a IRREGULAR no se detecta automaticamente · la devolucion no descuenta dias usados</text>
</svg>
