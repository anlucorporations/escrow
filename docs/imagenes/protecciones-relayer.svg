<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Las 5 protecciones del mensajero</text>

  <!-- Start -->
  <rect x="80" y="80" width="280" height="48" rx="12" fill="#48cae4"/>
  <text x="220" y="109" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Llega una peticion firmada</text>

  <!-- P1 -->
  <rect x="80" y="150" width="280" height="46" rx="12" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.5"/>
  <text x="220" y="178" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">1. Red correcta?</text>
  <!-- P2 -->
  <rect x="80" y="210" width="280" height="46" rx="12" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.5"/>
  <text x="220" y="238" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">2. Firma nueva (nonce)?</text>
  <!-- P3 -->
  <rect x="80" y="270" width="280" height="46" rx="12" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.5"/>
  <text x="220" y="298" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">3. Usuario VERIFICADO?</text>
  <!-- P4 -->
  <rect x="80" y="330" width="280" height="46" rx="12" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.5"/>
  <text x="220" y="358" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">4. Menos de 20 hoy?</text>
  <!-- P5 -->
  <rect x="80" y="390" width="280" height="46" rx="12" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.5"/>
  <text x="220" y="418" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">5. Sin bloqueo activo?</text>

  <!-- Vertical pass arrows -->
  <g stroke="#2a9d8f" stroke-width="3" marker-end="url(#arr)">
    <line x1="220" y1="130" x2="220" y2="146"/>
    <line x1="220" y1="198" x2="220" y2="206"/>
    <line x1="220" y1="258" x2="220" y2="266"/>
    <line x1="220" y1="318" x2="220" y2="326"/>
    <line x1="220" y1="378" x2="220" y2="386"/>
  </g>
  <text x="230" y="142" fill="#2a9d8f" font-size="10" font-weight="bold">si</text>

  <!-- Reject boxes -->
  <g>
    <rect x="500" y="150" width="260" height="46" rx="12" fill="#e63946"/>
    <text x="630" y="169" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Rechazada: cadena incorrecta</text>
    <text x="630" y="185" text-anchor="middle" fill="#ffffff" font-size="9.5">la firma es de otra red</text>
  </g>
  <g>
    <rect x="500" y="210" width="260" height="46" rx="12" fill="#e63946"/>
    <text x="630" y="229" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Rechazada: firma ya usada</text>
    <text x="630" y="245" text-anchor="middle" fill="#ffffff" font-size="9.5">anti-repeticion (nonce viejo)</text>
  </g>
  <g>
    <rect x="500" y="270" width="260" height="46" rx="12" fill="#e63946"/>
    <text x="630" y="289" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Rechazada: no verificado</text>
    <text x="630" y="305" text-anchor="middle" fill="#ffffff" font-size="9.5">INSCRITO no puede operar</text>
  </g>
  <g>
    <rect x="500" y="330" width="260" height="46" rx="12" fill="#e63946"/>
    <text x="630" y="349" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Rechazada: limite diario</text>
    <text x="630" y="365" text-anchor="middle" fill="#ffffff" font-size="9.5">vuelve manana</text>
  </g>
  <g>
    <rect x="500" y="390" width="260" height="46" rx="12" fill="#e63946"/>
    <text x="630" y="409" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Bloqueado 1 hora</text>
    <text x="630" y="425" text-anchor="middle" fill="#ffffff" font-size="9.5">3 fallos en 10 minutos</text>
  </g>

  <!-- No arrows to rejects -->
  <g stroke="#e63946" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="362" y1="173" x2="496" y2="173"/>
    <line x1="362" y1="233" x2="496" y2="233"/>
    <line x1="362" y1="293" x2="496" y2="293"/>
    <line x1="362" y1="353" x2="496" y2="353"/>
    <line x1="362" y1="413" x2="496" y2="413"/>
  </g>
  <text x="375" y="166" fill="#e63946" font-size="9.5" font-weight="bold">no</text>

  <!-- OK -->
  <rect x="300" y="452" width="200" height="40" rx="12" fill="#2a9d8f"/>
  <text x="400" y="477" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">OK: envia y paga el gas</text>

  <line x1="220" y1="438" x2="300" y2="472" stroke="#2a9d8f" stroke-width="3" fill="none" marker-end="url(#arr)"/>
</svg>
