<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Que guarda TrueKeate de ti (y como lo protege)</text>

  <!-- TU -->
  <rect x="330" y="80" width="140" height="54" rx="14" fill="#f4a261"/>
  <text x="400" y="114" text-anchor="middle" fill="#0a1128" font-size="14" font-weight="bold">TU</text>

  <!-- 1 registro -->
  <rect x="180" y="165" width="440" height="54" rx="13" fill="#48cae4"/>
  <text x="400" y="191" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">1. Registro: casilla de consentimiento + fecha (GDPR)</text>

  <!-- 2 datos cifrados -->
  <rect x="180" y="250" width="440" height="66" rx="13" fill="#2a9d8f"/>
  <text x="400" y="276" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">2. Datos personales cifrados en la base (D17)</text>
  <text x="400" y="296" text-anchor="middle" fill="#ffffff" font-size="11">correo · telefono · direccion · documento · selfie</text>

  <!-- 3 huella -->
  <rect x="180" y="348" width="440" height="56" rx="13" fill="#1a2b4c"/>
  <text x="400" y="372" text-anchor="middle" fill="#f3e5ab" font-size="12.5" font-weight="bold">3. Del documento + selfie se calcula</text>
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-size="11.5">una huella (raiz merkle)</text>

  <!-- 4 cadena -->
  <rect x="300" y="436" width="200" height="50" rx="13" fill="#d4af37"/>
  <text x="400" y="459" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">4. A la cadena solo</text>
  <text x="400" y="476" text-anchor="middle" fill="#0a1128" font-size="11">viaja la huella</text>

  <!-- 5 inactividad -->
  <rect x="580" y="250" width="180" height="66" rx="13" fill="#e2e8f0"/>
  <text x="670" y="276" text-anchor="middle" fill="#1a2b4c" font-size="11.5" font-weight="bold">5. Inactividad</text>
  <text x="670" y="294" text-anchor="middle" fill="#1a2b4c" font-size="10">24 meses sin entrar</text>
  <text x="670" y="308" text-anchor="middle" fill="#1a2b4c" font-size="10">-&gt; posible borrado</text>
  <text x="670" y="320" text-anchor="middle" fill="#e63946" font-size="9" font-weight="bold">pendiente de confirmar</text>

  <!-- Arrows -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="400" y1="136" x2="400" y2="161"/>
    <line x1="400" y1="221" x2="400" y2="246"/>
    <line x1="400" y1="318" x2="400" y2="344"/>
    <line x1="400" y1="406" x2="400" y2="432"/>
    <path d="M 622 250 L 640 236"/>
  </g>
  <text x="400" y="300" fill="#1a2b4c" font-size="9.5">si llevas 24 meses sin actividad</text>
  <text x="655" y="243" fill="#1a2b4c" font-size="9">borrado por</text>
  <text x="655" y="255" fill="#1a2b4c" font-size="9">inactividad</text>
</svg>
