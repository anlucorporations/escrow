<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Las piezas por capa</text>

  <!-- Capa 1 -->
  <rect x="40" y="80" width="720" height="86" rx="16" fill="#fdf1e7" stroke="#b06a2a" stroke-width="2"/>
  <text x="60" y="102" fill="#0a1128" font-size="12" font-weight="bold">Capa 1 · Contratos (blockchain)</text>
  <g>
    <rect x="60" y="114" width="160" height="38" rx="9" fill="#f4a261"/>
    <text x="140" y="138" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">Solidity 0.8.24</text>
  </g>
  <g>
    <rect x="240" y="114" width="160" height="38" rx="9" fill="#f4a261"/>
    <text x="320" y="138" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">Foundry</text>
  </g>
  <g>
    <rect x="420" y="114" width="160" height="38" rx="9" fill="#f4a261"/>
    <text x="500" y="130" text-anchor="middle" fill="#0a1128" font-size="10" font-weight="bold">OpenZeppelin</text>
    <text x="500" y="144" text-anchor="middle" fill="#0a1128" font-size="8.5">v5.0.2 (Ownable, ERC20...)</text>
  </g>
  <g>
    <rect x="600" y="114" width="140" height="38" rx="9" fill="#f4a261"/>
    <text x="670" y="138" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">forge-std</text>
  </g>

  <!-- Capa 2 -->
  <rect x="40" y="190" width="720" height="86" rx="16" fill="#e8f6fb" stroke="#1d7fa8" stroke-width="2"/>
  <text x="60" y="212" fill="#1d7fa8" font-size="12" font-weight="bold">Capa 2 · Servidores (Node.js)</text>
  <g>
    <rect x="60" y="224" width="160" height="38" rx="9" fill="#48cae4"/>
    <text x="140" y="248" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">ethers 6.17.0</text>
  </g>
  <g>
    <rect x="240" y="224" width="160" height="38" rx="9" fill="#48cae4"/>
    <text x="320" y="248" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">Express 5.2.1</text>
  </g>
  <g>
    <rect x="420" y="224" width="160" height="38" rx="9" fill="#48cae4"/>
    <text x="500" y="248" text-anchor="middle" fill="#0a1128" font-size="10.5" font-weight="bold">express-rate-limit</text>
  </g>
  <g>
    <rect x="600" y="224" width="140" height="38" rx="9" fill="#48cae4"/>
    <text x="670" y="248" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">pg 8.23.0</text>
  </g>

  <!-- Capa 3 -->
  <rect x="40" y="300" width="720" height="86" rx="16" fill="#e6f4f2" stroke="#1f6f64" stroke-width="2"/>
  <text x="60" y="322" fill="#1f6f64" font-size="12" font-weight="bold">Capa 3 · App web</text>
  <g>
    <rect x="60" y="334" width="160" height="38" rx="9" fill="#2a9d8f"/>
    <text x="140" y="358" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Next.js 16.3.4</text>
  </g>
  <g>
    <rect x="240" y="334" width="160" height="38" rx="9" fill="#2a9d8f"/>
    <text x="320" y="358" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">React 19.2.8</text>
  </g>
  <g>
    <rect x="420" y="334" width="160" height="38" rx="9" fill="#2a9d8f"/>
    <text x="500" y="358" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Tailwind 4.3.3</text>
  </g>
  <g>
    <rect x="600" y="334" width="140" height="38" rx="9" fill="#2a9d8f"/>
    <text x="670" y="358" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">ethers 6.17.0</text>
  </g>

  <!-- Capa servicios externos -->
  <rect x="40" y="410" width="720" height="74" rx="16" fill="#fdf6e3" stroke="#8a6d1f" stroke-width="2"/>
  <text x="60" y="432" fill="#8a6d1f" font-size="12" font-weight="bold">Servicios externos</text>
  <g>
    <rect x="60" y="442" width="150" height="32" rx="9" fill="#d4af37"/>
    <text x="135" y="463" text-anchor="middle" fill="#0a1128" font-size="10.5" font-weight="bold">PostgreSQL + PostGIS</text>
  </g>
  <g>
    <rect x="225" y="442" width="150" height="32" rx="9" fill="#d4af37"/>
    <text x="300" y="463" text-anchor="middle" fill="#0a1128" font-size="10.5" font-weight="bold">GCP Secret Manager</text>
  </g>
  <g>
    <rect x="390" y="442" width="130" height="32" rx="9" fill="#d4af37"/>
    <text x="455" y="463" text-anchor="middle" fill="#0a1128" font-size="10.5" font-weight="bold">MetaMask</text>
  </g>
  <g>
    <rect x="535" y="442" width="150" height="32" rx="9" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
    <text x="610" y="463" text-anchor="middle" fill="#1a2b4c" font-size="10.5" font-weight="bold">IPFS (pendiente)</text>
  </g>

  <!-- Relations arrows between caps -->
  <g stroke="#1a2b4c" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="400" y1="168" x2="400" y2="186"/>
    <line x1="400" y1="278" x2="400" y2="296"/>
  </g>
  <text x="412" y="180" fill="#1a2b4c" font-size="9.5">se apoya en</text>
  <text x="412" y="290" fill="#1a2b4c" font-size="9.5">habla con</text>
</svg>
