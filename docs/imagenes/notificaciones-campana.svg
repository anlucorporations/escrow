<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="sans-serif"><defs><marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a9d8f"/></marker><marker id="arrC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e63946"/></marker></defs><rect width="1200" height="650" fill="#f8f9fa"/><rect width="1200" height="58" fill="#1a2b4c"/><rect y="54" width="1200" height="4" fill="#d4af37"/><text x="600" y="36" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">La campana de avisos: qué te notifica y cómo funciona</text><text x="300" y="92" font-size="14.5" font-weight="bold" fill="#1a2b4c" text-anchor="middle" data-out="1">Los 4 avisos que te llegan</text><rect x="50" y="97" width="510" height="78" rx="14" fill="#ffffff" stroke="#d7dfe9" stroke-width="1.3" data-card="1"/><rect x="60" y="107" width="8" height="58" rx="4" fill="#f4a261"/><circle cx="86" cy="136" r="15" fill="#f4a261"/><text x="86" y="136.5" font-size="12.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="20">1</text><text x="116" y="120" font-size="14" font-weight="bold" fill="#b06a2a" text-anchor="start" data-in="1" data-mw="424">Disputa reportada</text><text x="116" y="139" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">te declararon ✗ No Conforme en un</text><text x="116" y="154" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">trueque donde participas</text><rect x="50" y="187" width="510" height="78" rx="14" fill="#ffffff" stroke="#d7dfe9" stroke-width="1.3" data-card="1"/><rect x="60" y="197" width="8" height="58" rx="4" fill="#d4af37"/><circle cx="86" cy="226" r="15" fill="#d4af37"/><text x="86" y="226.5" font-size="12.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="20">2</text><text x="116" y="210" font-size="14" font-weight="bold" fill="#8a6d1f" text-anchor="start" data-in="1" data-mw="424">Pedido de justificativo</text><text x="116" y="229" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">eres el conforme: sube tus fotos</text><text x="116" y="244" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">en 3 días (si no, se anula)</text><rect x="50" y="277" width="510" height="78" rx="14" fill="#ffffff" stroke="#d7dfe9" stroke-width="1.3" data-card="1"/><rect x="60" y="287" width="8" height="58" rx="4" fill="#2a9d8f"/><circle cx="86" cy="316" r="15" fill="#2a9d8f"/><text x="86" y="316.5" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="20">3</text><text x="116" y="300" font-size="14" font-weight="bold" fill="#1f6f64" text-anchor="start" data-in="1" data-mw="424">Votación abierta</text><text x="116" y="319" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">si eres Socio: hay una disputa</text><text x="116" y="334" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">esperando tu voto · 5 días</text><rect x="50" y="367" width="510" height="78" rx="14" fill="#ffffff" stroke="#d7dfe9" stroke-width="1.3" data-card="1"/><rect x="60" y="377" width="8" height="58" rx="4" fill="#1a2b4c"/><circle cx="86" cy="406" r="15" fill="#1a2b4c"/><text x="86" y="406.5" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="20">4</text><text x="116" y="390" font-size="14" font-weight="bold" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">Veredicto</text><text x="116" y="409" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">se resolvió una disputa en la que</text><text x="116" y="424" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-in="1" data-mw="424">participas: ANULAR o VALIDO</text><rect x="50" y="452" width="510" height="158" rx="14" fill="#e9e5f0" data-card="1"/><text x="300" y="486" font-size="13" font-weight="bold" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="480">Recuerda los plazos</text><text x="300" y="512" font-size="11" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="480">Los plazos no esperan: 3 días para el justificativo · 5 días de votación</text><text x="300" y="529" font-size="11" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="480">Si nadie vota o hay empate, el veredicto es ANULAR por defecto</text><text x="300" y="546" font-size="11" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="480">y, si eres parte del caso, siempre puedes ver las pruebas de ambos lados</text><text x="890" y="92" font-size="14.5" font-weight="bold" fill="#1a2b4c" text-anchor="middle" data-out="1">El ciclo del aviso</text><rect x="610" y="107" width="560" height="66" rx="14" fill="#48cae4" stroke="#1d7fa8" stroke-width="1.4" data-card="1" data-cx="890" data-cy="140" data-w="560" data-h="66"/><text x="890" y="142.4" font-size="14.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="544">Motor de la plataforma</text><text x="890" y="158.9" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="544">los eventos de disputas y cierres de trueques crean avisos</text><rect x="610" y="215" width="560" height="66" rx="14" fill="#2a9d8f" stroke="#1f6f64" stroke-width="1.4" data-card="1" data-cx="890" data-cy="248" data-w="560" data-h="66"/><text x="890" y="250.4" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="544">Avisos guardados</text><text x="890" y="266.9" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="544">uno por wallet · tipo de aviso · leída o no</text><rect x="610" y="323" width="560" height="66" rx="14" fill="#d4af37" stroke="#8a6d1f" stroke-width="1.4" data-card="1" data-cx="890" data-cy="356" data-w="560" data-h="66"/><text x="890" y="358.4" font-size="14.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="544">Campana en la barra superior</text><text x="890" y="374.9" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="544">contador rojo con tus avisos sin leer</text><rect x="610" y="427" width="560" height="74" rx="14" fill="#1a2b4c" stroke="#0a1128" stroke-width="1.4" data-card="1" data-cx="890" data-cy="464" data-w="560" data-h="74"/><text x="890" y="466.4" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="544">Lista de avisos (máx. 12)</text><text x="890" y="482.9" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="544">un icono por tipo · cada uno enlaza a su caso</text><path d="M 890 173 L 890 215" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="904" y="197.5" font-size="9.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-out="1">crea y guarda el aviso</text><path d="M 890 281 L 890 323" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="904" y="305.5" font-size="9.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-out="1">la app consulta al abrir y cada 30 s</text><path d="M 890 389 L 890 427" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="904" y="411.5" font-size="9.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-out="1">abres la campana</text><rect x="612" y="518" width="265" height="84" rx="14" fill="#f4a261" stroke="#b06a2a" stroke-width="1.4" data-card="1" data-cx="744.5" data-cy="560" data-w="265" data-h="84"/><text x="744.5" y="554.5" font-size="13" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="249">Pulsas un aviso</text><text x="744.5" y="569.9" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="249">te lleva a la disputa</text><text x="744.5" y="584.4" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="249">o al trueque</text><rect x="897" y="518" width="265" height="84" rx="14" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.4" data-card="1" data-cx="1029.5" data-cy="560" data-w="265" data-h="84"/><text x="1029.5" y="554.5" font-size="13" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="249">Marcas leída</text><text x="1029.5" y="569.9" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="249">una a una o todas</text><text x="1029.5" y="584.4" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="249">a la vez</text><path d="M 744.5 501 L 744.5 518" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><path d="M 1029.5 501 L 1029.5 518" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/></svg>