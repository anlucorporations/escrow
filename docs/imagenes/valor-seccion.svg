<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="sans-serif"><defs><marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/></marker></defs><rect width="1200" height="740" fill="#f8f9fa"/><rect width="1200" height="58" fill="#1a2b4c"/><rect y="54" width="1200" height="4" fill="#d4af37"/><text x="600" y="36" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">VALOR · tus 3 subsecciones: Criptos, Reputación y BRLT</text><rect x="70" y="92" width="1060" height="84" rx="16" fill="#1a2b4c" data-card="1"/><text x="600" y="116" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="600">¿Quién gestiona tu VALOR?</text><rect x="120" y="116" width="460" height="52" rx="26" fill="#e9e5f0" data-card="1"/><text x="350" y="137" font-size="12.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="420">PARTICULAR</text><text x="350" y="157" font-size="10" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="420">solo lectura: ve sus cifras y reputación (—)</text><rect x="620" y="116" width="460" height="52" rx="26" fill="#d4af37" data-card="1"/><text x="850" y="137" font-size="12.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="420">EMPRESA · SOCIO · OWNER</text><text x="850" y="157" font-size="10" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="420">gestionan criptos y BRLT (recargar, retirar, comprar)</text><line x1="240" y1="180" x2="240" y2="218" stroke="#8d86a9" stroke-width="1.6" stroke-dasharray="3 5"/><line x1="600" y1="180" x2="600" y2="218" stroke="#8d86a9" stroke-width="1.6" stroke-dasharray="3 5"/><line x1="960" y1="180" x2="960" y2="218" stroke="#8d86a9" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="70" y="220" width="340" height="316" rx="16" fill="#2a9d8f" stroke="#1f6f64" stroke-width="1.5" data-card="1"/><text x="240" y="260" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">4.1 · Criptos (ETH)</text><text x="240" y="299.6" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">Tu saldo de ETH</text><text x="240" y="339.2" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">↑ Recargar ETH</text><text x="240" y="378.8" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">↓ Retirar a tu billetera</text><text x="240" y="418.4" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">↔ Convertir ETH ↔ BRLT</text><text x="240" y="458" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">Tasa interna: 1 ETH ≈ 3.000 BRLT</text><rect x="128.97750000000002" y="494" width="222.045" height="28" rx="14" fill="#1f6f64"/><text x="240" y="498" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="210">acceso: Empresa · Socio · Owner</text><rect x="430" y="220" width="340" height="316" rx="16" fill="#f4a261" stroke="#b06a2a" stroke-width="1.5" data-card="1"/><text x="600" y="260" font-size="16" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="314">4.2 · Reputación</text><text x="600" y="299.6" font-size="11.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="314">Puntaje 0–100 (D12/D30)</text><text x="600" y="339.2" font-size="11.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="314">Nivel y medalla (hasta SOCIO)</text><text x="600" y="378.8" font-size="11.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="314">★ Valorar 1–5 a quien truequeaste</text><text x="600" y="418.4" font-size="11.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="314">5 dimensiones por valorar</text><text x="600" y="458" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="314">Los sin valorar quedan en tu lista</text><rect x="523.365" y="494" width="153.26999999999998" height="28" rx="14" fill="#b06a2a"/><text x="600" y="498" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="141.3">acceso: todo inscrito</text><rect x="790" y="220" width="340" height="316" rx="16" fill="#1a2b4c" stroke="#0a1128" stroke-width="1.5" data-card="1"/><text x="960" y="260" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">4.3 · BRLT (BorloTokens)</text><text x="960" y="299.6" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">La moneda interna de la plataforma</text><text x="960" y="339.2" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">Comprar con tarjeta: Stripe</text><text x="960" y="378.8" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">(pago alojado · sin guardar tus datos)</text><text x="960" y="418.4" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">↓ Retirar · ↔ Convertir a ETH</text><text x="960" y="458" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="314">1 BRLT se mueve siempre contra la plataforma</text><rect x="848.9775" y="494" width="222.045" height="28" rx="14" fill="#d4af37"/><text x="960" y="498" font-size="10.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="210">acceso: Empresa · Socio · Owner</text><rect x="120" y="604" width="960" height="96" rx="16" fill="#e9e5f0" data-card="1"/><text x="600" y="628" font-size="14" font-weight="bold" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="900">Movimientos registrados uno por uno (auditoría)</text><text x="600" y="651" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="920">4.1 Criptos → la contraparte es siempre la PLATAFORMA (no hay envíos P2P entre personas)</text><text x="600" y="669" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="920">4.3 BRLT → Stripe confirma el pago con tarjeta por webhook y la plataforma acredita el saldo</text><text x="600" y="687" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-in="1" data-mw="920">4.2 Reputación → las valoraciones alimentan la reputación de la comunidad</text><path d="M 240 536 L 240 604" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><path d="M 960 536 L 960 604" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/></svg>