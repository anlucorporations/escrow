<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Firmar y autorizar en TrueKeate</text>

  <!-- A: boton -->
  <rect x="80" y="62" width="400" height="42" rx="12" fill="#f4a261"/>
  <text x="280" y="89" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">1 · Pulsar «Conectar MetaMask e iniciar sesión»</text>

  <!-- B: permiso cuentas -->
  <rect x="80" y="116" width="400" height="50" rx="12" fill="#48cae4"/>
  <text x="280" y="136" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">2 · MetaMask: «Conectar con TrueKeate»</text>
  <text x="280" y="154" text-anchor="middle" fill="#0a1128" font-size="10.5">permiso para VER tus cuentas · no firma nada</text>

  <!-- C: decision inscrita -->
  <rect x="80" y="178" width="400" height="52" rx="12" fill="#f3e5ab" stroke="#c5a065" stroke-width="2"/>
  <text x="280" y="208" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">3 · ¿Esta wallet está inscrita en TrueKeate?</text>

  <!-- D: no inscrita -->
  <rect x="540" y="178" width="230" height="52" rx="12" fill="#8d86a9"/>
  <text x="655" y="197" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">No inscrita</text>
  <text x="655" y="213" text-anchor="middle" fill="#ffffff" font-size="9.5">solo verás catálogo y la pantalla</text>
  <text x="655" y="225" text-anchor="middle" fill="#ffffff" font-size="9.5">de inscripción (correo, teléfono…)</text>

  <!-- E: firmar sesion -->
  <rect x="80" y="244" width="400" height="52" rx="12" fill="#d4af37"/>
  <text x="280" y="264" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">4 · MetaMask pide firmar el mensaje:</text>
  <text x="280" y="282" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">«TrueKeate: iniciar sesión»</text>

  <!-- F: rechazas -->
  <rect x="540" y="244" width="230" height="52" rx="12" fill="#e63946"/>
  <text x="655" y="263" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">Rechazas</text>
  <text x="655" y="279" text-anchor="middle" fill="#ffffff" font-size="9.5">no hay sesión: puedes</text>
  <text x="655" y="291" text-anchor="middle" fill="#ffffff" font-size="9.5">volver a intentarlo</text>

  <!-- G: servidor valida -->
  <rect x="80" y="310" width="400" height="50" rx="12" fill="#2a9d8f"/>
  <text x="280" y="329" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">5 · El servidor valida tu firma</text>
  <text x="280" y="346" text-anchor="middle" fill="#ffffff" font-size="10.5">y emite tu pase de sesión (sin gas)</text>

  <!-- H: dentro -->
  <rect x="80" y="374" width="400" height="48" rx="12" fill="#2a9d8f"/>
  <text x="280" y="392" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">6 · ¡Dentro! El pase se guarda</text>
  <text x="280" y="408" text-anchor="middle" fill="#ffffff" font-size="10.5">al recargar la web sigues dentro</text>

  <!-- I: acciones hoy -->
  <rect x="60" y="436" width="300" height="58" rx="12" fill="#2a9d8f"/>
  <text x="210" y="455" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="bold">Hoy: custodiar mi lado, firmar</text>
  <text x="210" y="469" text-anchor="middle" fill="#ffffff" font-size="10.5">la recepción y valorar se guardan</text>
  <text x="210" y="483" text-anchor="middle" fill="#ffffff" font-size="10.5">con tu sesión, sin abrir MetaMask</text>

  <!-- J: futuro -->
  <rect x="420" y="436" width="350" height="58" rx="12" fill="#d4af37"/>
  <text x="595" y="455" text-anchor="middle" fill="#0a1128" font-size="10.5" font-weight="bold">A futuro: firmarás tu intención</text>
  <text x="595" y="469" text-anchor="middle" fill="#0a1128" font-size="10.5">(EIP-712 «TrueKeate SmartAccount»)</text>
  <text x="595" y="483" text-anchor="middle" fill="#0a1128" font-size="10.5">y el relayer pagará el gas por ti</text>

  <!-- Flechas -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="280" y1="104" x2="280" y2="112"/>
    <line x1="280" y1="166" x2="280" y2="174"/>
    <line x1="280" y1="230" x2="280" y2="240"/>
    <line x1="280" y1="296" x2="280" y2="306"/>
    <line x1="280" y1="360" x2="280" y2="370"/>
    <line x1="280" y1="422" x2="280" y2="432"/>
    <line x1="364" y1="465" x2="416" y2="465"/>
    <line x1="480" y1="204" x2="536" y2="204"/>
    <line x1="480" y1="270" x2="536" y2="270"/>
  </g>
  <text x="290" y="239" fill="#1a2b4c" font-size="10.5" font-weight="bold">sí, inscrita</text>
  <text x="505" y="197" fill="#1a2b4c" font-size="10" font-weight="bold">no inscrita</text>
  <text x="290" y="304" fill="#1a2b4c" font-size="10.5" font-weight="bold">firmas</text>
  <text x="505" y="263" fill="#1a2b4c" font-size="10" font-weight="bold">rechazas</text>

</svg>
