  <!-- Placeholder note -->
  <rect x="60" y="440" width="540" height="42" rx="12" fill="#f3e5ab"/>
  <text x="330" y="457" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">Los modulos en construccion muestran: "Este modulo se completa en la</text>
  <text x="330" y="473" text-anchor="middle" fill="#0a1128" font-size="11">integracion final. Acceso segun rol y estado". No se prometen funcionales.</text>
