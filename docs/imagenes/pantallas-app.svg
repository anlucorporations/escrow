  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="202" y1="255" x2="276" y2="255"/>
    <path d="M 460 255 L 596 116"/>
    <path d="M 460 255 L 596 206"/>
