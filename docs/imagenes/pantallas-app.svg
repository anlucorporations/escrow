    <text x="685" y="216" text-anchor="middle" fill="#0a1128" font-size="10">crear y ver trueques</text>
    <text x="685" y="232" text-anchor="middle" fill="#e63946" font-size="9.5" font-weight="bold">en construccion</text>
  </g>
  <g>
    <rect x="600" y="260" width="170" height="72" rx="12" fill="#48cae4"/>
    <text x="685" y="288" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Socios</text>
    <text x="685" y="306" text-anchor="middle" fill="#0a1128" font-size="10">gobernanza y votos</text>
    <text x="685" y="322" text-anchor="middle" fill="#e63946" font-size="9.5" font-weight="bold">en construccion</text>
  </g>
  <g>
    <rect x="600" y="350" width="170" height="72" rx="12" fill="#48cae4"/>
    <text x="685" y="378" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Perfil</text>
    <text x="685" y="396" text-anchor="middle" fill="#0a1128" font-size="10">tus datos</text>
    <text x="685" y="412" text-anchor="middle" fill="#e63946" font-size="9.5" font-weight="bold">en construccion</text>
