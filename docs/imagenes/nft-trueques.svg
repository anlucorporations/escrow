<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#e63946"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Añade y verifica los NFTs de tus trueques</text>

  <!-- Paso 1 -->
  <rect x="60" y="60" width="500" height="40" rx="12" fill="#f4a261"/>
  <text x="310" y="86" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">1 · Red de TrueKeate seleccionada (31337)</text>

  <!-- Paso 2 -->
  <rect x="60" y="112" width="500" height="40" rx="12" fill="#48cae4"/>
  <text x="310" y="138" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">2 · Pestaña «NFTs» → «Importar NFTs»</text>

  <!-- Paso 3 -->
  <rect x="60" y="164" width="500" height="64" rx="12" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
  <text x="310" y="186" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">3 · Rellena la dirección del contrato TrueKeateNFT (TKANFT):</text>
  <text x="310" y="207" text-anchor="middle" fill="#1a2b4c" font-size="11" font-weight="bold">0x99dbe4aea58e518c50a1c04ae9b48c9f6354612f</text>
  <text x="310" y="221" text-anchor="middle" fill="#1a2b4c" font-size="10">y el token ID: número entero en orden desde el 1 (ej. ID 1)</text>

  <!-- Paso 4 -->
  <rect x="60" y="240" width="500" height="40" rx="12" fill="#48cae4"/>
  <text x="310" y="266" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">4 · Pulsa «Añadir»</text>

  <!-- Decision -->
  <rect x="60" y="292" width="500" height="56" rx="12" fill="#d4af37"/>
  <text x="310" y="318" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">5 · ¿MetaMask confirma que tu cuenta posee el token?</text>
  <text x="310" y="338" text-anchor="middle" fill="#0a1128" font-size="10">la propiedad se comprueba en la blockchain (ownerOf / balanceOf)</text>

  <!-- No: error -->
  <rect x="590" y="292" width="200" height="56" rx="12" fill="#e63946"/>
  <text x="690" y="314" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">No / error</text>
  <text x="690" y="330" text-anchor="middle" fill="#ffffff" font-size="9.5">comprueba el token ID y la</text>
  <text x="690" y="343" text-anchor="middle" fill="#ffffff" font-size="9.5">red; pregunta al contrato</text>

  <!-- Si: listo -->
  <rect x="60" y="362" width="500" height="44" rx="12" fill="#2a9d8f"/>
  <text x="310" y="390" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Sí → ¡Listo! El NFT aparece en tu colección</text>

  <!-- Nota -->
  <rect x="60" y="418" width="500" height="72" rx="12" fill="#8d86a9"/>
  <text x="310" y="440" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Recuerda: el contrato de pruebas no define imagen ni</text>
  <text x="310" y="456" text-anchor="middle" fill="#ffffff" font-size="10">descripción (metadatos), por eso puede verse sin imagen.</text>
  <text x="310" y="474" text-anchor="middle" fill="#ffffff" font-size="10">La propiedad se comprueba en la blockchain: ownerOf(ID).</text>

  <!-- Flechas -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="310" y1="100" x2="310" y2="108"/>
    <line x1="310" y1="152" x2="310" y2="160"/>
    <line x1="310" y1="228" x2="310" y2="236"/>
    <line x1="310" y1="280" x2="310" y2="288"/>
    <line x1="310" y1="348" x2="310" y2="358"/>
    <line x1="310" y1="406" x2="310" y2="414"/>
    <line x1="560" y1="320" x2="586" y2="320"/>
  </g>
  <text x="318" y="358" fill="#2a9d8f" font-size="11" font-weight="bold">sí</text>
  <text x="573" y="314" fill="#e63946" font-size="10" font-weight="bold">no</text>

  <!-- Bucle: no -> volver al paso 3 -->
  <g stroke="#e63946" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)">
    <path d="M 700 292 L 700 210 L 563 210"/>
  </g>
  <text x="712" y="262" fill="#e63946" font-size="10" font-weight="bold">vuelve al paso 3</text>
</svg>
