<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Como trabaja el vigilante (una ronda)</text>

  <!-- Events on chain -->
  <g>
    <rect x="60" y="100" width="190" height="50" rx="10" fill="#e63946"/>
    <text x="155" y="120" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">TruekeCreado</text>
    <text x="155" y="136" text-anchor="middle" fill="#ffffff" font-size="9.5">en la blockchain</text>
  </g>
  <g>
    <rect x="60" y="175" width="190" height="50" rx="10" fill="#e63946"/>
    <text x="155" y="195" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">CustodiaA</text>
    <text x="155" y="211" text-anchor="middle" fill="#ffffff" font-size="9.5">en la blockchain</text>
  </g>
  <g>
    <rect x="60" y="250" width="190" height="50" rx="10" fill="#e63946"/>
    <text x="155" y="270" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">TruekeCompletado</text>
    <text x="155" y="286" text-anchor="middle" fill="#ffffff" font-size="9.5">en la blockchain</text>
  </g>

  <!-- Vigilante -->
  <rect x="320" y="140" width="150" height="120" rx="14" fill="#48cae4"/>
  <text x="395" y="180" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">El vigilante</text>
  <text x="395" y="198" text-anchor="middle" fill="#0a1128" font-size="10.5">indexador</text>
  <text x="395" y="226" text-anchor="middle" fill="#0a1128" font-size="10">lee los avisos</text>
  <text x="395" y="241" text-anchor="middle" fill="#0a1128" font-size="10">cada 5 segundos</text>

  <!-- Decision -->
  <rect x="560" y="160" width="190" height="80" rx="14" fill="#f3e5ab" stroke="#c5a065" stroke-width="2"/>
  <text x="655" y="196" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">Ya anote</text>
  <text x="655" y="213" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">este aviso?</text>

  <!-- Omite -->
  <rect x="560" y="280" width="190" height="60" rx="12" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
  <text x="655" y="306" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">Lo omite</text>
  <text x="655" y="323" text-anchor="middle" fill="#1a2b4c" font-size="10">no duplica</text>

  <!-- Aplica -->
  <rect x="300" y="290" width="190" height="64" rx="12" fill="#2a9d8f"/>
  <text x="395" y="316" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Interpreta y aplica:</text>
  <text x="395" y="334" text-anchor="middle" fill="#ffffff" font-size="10.5">actualiza el espejo</text>

  <!-- Auditoria -->
  <rect x="300" y="395" width="190" height="58" rx="12" fill="#d4af37"/>
  <text x="395" y="419" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">Registra en auditoria</text>
  <text x="395" y="437" text-anchor="middle" fill="#0a1128" font-size="10">historial imborrable</text>

  <!-- Checkpoint -->
  <rect x="560" y="395" width="190" height="58" rx="12" fill="#2a9d8f"/>
  <text x="655" y="419" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">Guarda el avance</text>
  <text x="655" y="437" text-anchor="middle" fill="#ffffff" font-size="10">checkpoint</text>

  <!-- Arrows -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="252" y1="125" x2="316" y2="160"/>
    <line x1="252" y1="200" x2="316" y2="195"/>
    <line x1="252" y1="275" x2="316" y2="235"/>
    <line x1="472" y1="200" x2="556" y2="200"/>
    <!-- si repetido -->
    <path d="M 655 242 L 655 276"/>
    <!-- no nuevo -->
    <path d="M 570 230 L 490 300"/>
  </g>
  <text x="272" y="180" fill="#1a2b4c" font-size="9">avisos</text>
  <text x="512" y="193" fill="#1a2b4c" font-size="10">nuevo aviso?</text>
  <text x="664" y="262" fill="#1a2b4c" font-size="10">si, repetido</text>
  <text x="500" y="272" fill="#1a2b4c" font-size="10" font-weight="bold">no, nuevo</text>

  <!-- from aplica to auditoria/checkpoint -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="395" y1="356" x2="395" y2="391"/>
    <path d="M 492 322 L 556 322 L 556 391"/>
  </g>
  <text x="405" y="380" fill="#1a2b4c" font-size="9.5">anota</text>
  <text x="525" y="330" fill="#1a2b4c" font-size="9">anota</text>

  <!-- Note -->
  <rect x="40" y="470" width="720" height="22" rx="10" fill="#f3e5ab"/>
  <text x="400" y="485" text-anchor="middle" fill="#0a1128" font-size="9.5" font-weight="bold">Si un aviso falla al aplicarse no rompe la ronda: se marca como fallido y sigue con el siguiente</text>
</svg>
