<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Los servidores vigilantes de TrueKeate</text>

  <text x="40" y="80" fill="#1a2b4c" font-size="11" font-weight="bold">USUARIOS</text>
  <text x="300" y="80" fill="#1a2b4c" font-size="11" font-weight="bold">USUARIOS</text>
  <text x="40" y="222" fill="#1a2b4c" font-size="11" font-weight="bold">SERVIDORES DE TRUEKEATE</text>
  <text x="300" y="382" fill="#1a2b4c" font-size="11" font-weight="bold">GUARDADO</text>

  <!-- Users -->
  <rect x="40" y="90" width="180" height="70" rx="14" fill="#48cae4"/>
  <text x="130" y="118" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">Ana · particular</text>
  <text x="130" y="136" text-anchor="middle" fill="#0a1128" font-size="10.5">firma, no paga gas</text>

  <rect x="580" y="90" width="180" height="70" rx="14" fill="#d4af37"/>
  <text x="670" y="118" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">Empresa</text>
  <text x="670" y="136" text-anchor="middle" fill="#0a1128" font-size="10.5">envia directo, paga su gas</text>

  <!-- Servers -->
  <rect x="40" y="240" width="180" height="86" rx="14" fill="#2a9d8f"/>
  <text x="130" y="270" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Camarero · API</text>
  <text x="130" y="288" text-anchor="middle" fill="#ffffff" font-size="10">recibe peticiones</text>
  <text x="130" y="304" text-anchor="middle" fill="#ffffff" font-size="10">de la app</text>

  <rect x="300" y="240" width="180" height="86" rx="14" fill="#1a2b4c"/>
  <text x="390" y="270" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Mensajero · relayer</text>
  <text x="390" y="288" text-anchor="middle" fill="#f3e5ab" font-size="10">revisa firmas</text>
  <text x="390" y="304" text-anchor="middle" fill="#f3e5ab" font-size="10">envia y paga el gas</text>

  <rect x="580" y="240" width="180" height="86" rx="14" fill="#48cae4"/>
  <text x="670" y="270" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">Vigilante · indexador</text>
  <text x="670" y="288" text-anchor="middle" fill="#0a1128" font-size="10">escucha los eventos</text>
  <text x="670" y="304" text-anchor="middle" fill="#0a1128" font-size="10">copia a la base</text>

  <!-- Storage -->
  <rect x="300" y="400" width="180" height="70" rx="14" fill="#e63946"/>
  <text x="390" y="428" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Blockchain</text>
  <text x="390" y="446" text-anchor="middle" fill="#ffffff" font-size="10">estados del escrow</text>

  <rect x="580" y="400" width="180" height="70" rx="14" fill="#2a9d8f"/>
  <text x="670" y="428" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">PostgreSQL</text>
  <text x="670" y="446" text-anchor="middle" fill="#ffffff" font-size="10">copias rapidas</text>

  <!-- Arrows -->
  <g stroke="#1a2b4c" stroke-width="2" fill="none" marker-end="url(#arr)">
    <!-- Ana -> API -->
    <line x1="130" y1="162" x2="130" y2="236"/>
    <!-- Empresa -> BC (elbow por la izquierda) -->
    <path d="M 580 120 L 290 120 L 290 435 L 298 435"/>
    <!-- API -> relayer -->
    <line x1="222" y1="283" x2="296" y2="283"/>
    <!-- relayer -> blockchain -->
    <line x1="390" y1="328" x2="390" y2="396"/>
    <!-- blockchain -> indexador (eventos) -->
    <path d="M 482 440 L 560 320"/>
    <!-- indexador -> postgres -->
    <line x1="670" y1="328" x2="670" y2="396"/>
  </g>

  <!-- Labels -->
  <text x="142" y="210" fill="#1a2b4c" font-size="10">peticiones</text>
  <text x="415" y="112" fill="#1a2b4c" font-size="9.5" font-weight="bold">directo</text>
  <text x="415" y="125" fill="#1a2b4c" font-size="9.5">paga su gas</text>
  <text x="255" y="274" fill="#1a2b4c" font-size="9.5">llama</text>
  <text x="398" y="370" fill="#1a2b4c" font-size="10">paga el gas</text>
  <text x="500" y="400" fill="#1a2b4c" font-size="10">eventos</text>
  <text x="680" y="370" fill="#1a2b4c" font-size="10">copias</text>
</svg>
