<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">La firma digital: como demuestra que fuiste tu</text>

  <!-- Actors -->
  <g>
    <rect x="40" y="80" width="160" height="48" rx="12" fill="#48cae4"/>
    <text x="120" y="102" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">Tu (billetera)</text>
    <text x="120" y="119" text-anchor="middle" fill="#0a1128" font-size="9.5">MetaMask</text>
  </g>
  <g>
    <rect x="260" y="80" width="150" height="48" rx="12" fill="#2a9d8f"/>
    <text x="335" y="102" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">La app</text>
    <text x="335" y="119" text-anchor="middle" fill="#ffffff" font-size="9.5">te muestra la accion</text>
  </g>
  <g>
    <rect x="480" y="80" width="150" height="48" rx="12" fill="#1a2b4c"/>
    <text x="555" y="102" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Mensajero</text>
    <text x="555" y="119" text-anchor="middle" fill="#f3e5ab" font-size="9">paga el gas</text>
  </g>
  <g>
    <rect x="680" y="80" width="90" height="48" rx="12" fill="#e63946"/>
    <text x="725" y="102" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Tu cuenta</text>
    <text x="725" y="119" text-anchor="middle" fill="#ffffff" font-size="9.5">inteligente</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="120" y1="128" x2="120" y2="420"/>
    <line x1="335" y1="128" x2="335" y2="420"/>
    <line x1="555" y1="128" x2="555" y2="420"/>
    <line x1="725" y1="128" x2="725" y2="420"/>
  </g>

  <!-- Steps -->
  <line x1="122" y1="150" x2="333" y2="150" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="228" y="143" text-anchor="middle" fill="#1a2b4c" font-size="10">"Quiero custodiar mi objeto"</text>

  <line x1="333" y1="182" x2="124" y2="182" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="228" y="175" text-anchor="middle" fill="#1a2b4c" font-size="10">"Firma este mensaje (EIP-712)"</text>

  <line x1="122" y1="214" x2="333" y2="214" stroke="#1a2b4c" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr)"/>
  <text x="228" y="207" text-anchor="middle" fill="#1a2b4c" font-size="10">Firmas con tu clave privada</text>

  <line x1="335" y1="248" x2="478" y2="248" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="406" y="241" text-anchor="middle" fill="#1a2b4c" font-size="10">Entrega la firma</text>

  <line x1="557" y1="280" x2="723" y2="280" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="640" y="273" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold">Ejecuta en la cadena (paga el gas)</text>

  <!-- Check card -->
  <rect x="330" y="300" width="380" height="52" rx="12" fill="#f3e5ab"/>
  <text x="520" y="320" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">Tu cuenta comprueba:</text>
  <text x="520" y="338" text-anchor="middle" fill="#0a1128" font-size="10.5">firma valida · numero de un solo uso (nonce)</text>
  <line x1="725" y1="306" x2="725" y2="314" stroke="#1a2b4c" stroke-width="1.5"/>

  <line x1="723" y1="372" x2="124" y2="372" stroke="#2a9d8f" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <text x="420" y="365" text-anchor="middle" fill="#2a9d8f" font-size="10.5" font-weight="bold">Hecho OK: accion ejecutada</text>

  <!-- Nonce note -->
  <rect x="150" y="430" width="500" height="52" rx="12" fill="#0a1128"/>
  <text x="400" y="450" text-anchor="middle" fill="#f3e5ab" font-size="11" font-weight="bold">El numero de un solo uso (nonce) evita el anti-replay:</text>
  <text x="400" y="468" text-anchor="middle" fill="#ffffff" font-size="10.5">una firma copiada no vale dos veces, como un cheque numerado</text>
</svg>
