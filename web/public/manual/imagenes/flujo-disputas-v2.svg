<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300" font-family="sans-serif"><defs><marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/></marker><marker id="arrC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e63946"/></marker></defs><rect width="1200" height="1300" fill="#f8f9fa"/><rect width="1200" height="58" fill="#1a2b4c"/><rect y="54" width="1200" height="4" fill="#d4af37"/><text x="600" y="28" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Disputas v2: el camino de un trueque que salió mal</text><text x="600" y="46" font-size="10.5" font-weight="normal" fill="#c9d8f0" text-anchor="middle">etapas: REPORTADA → ESPERA_JUSTIFICATIVO → EN_VOTACION → RESUELTA · veredictos: ANULAR o VALIDO</text><rect x="400" y="71" width="400" height="58" rx="14" fill="#48cae4" stroke="#1d7fa8" stroke-width="1.4" data-card="1" data-cx="600" data-cy="100" data-w="400" data-h="58"/><text x="600" y="102.8" font-size="15" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="384">Cierre del trueque</text><text x="600" y="119.5" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="384">ambas partes confirman lo recibido</text><path d="M 600 129 L 600 166" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><polygon points="600,166 712,232 600,298 488,232" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.6" data-card="1" data-cx="600" data-cy="232" data-hw="112" data-hh="66"/><text x="600" y="229" font-size="11.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="194">¿Alguien marca</text><text x="600" y="244.2" font-size="11.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="194">✗ No Conforme?</text><rect x="865" y="190" width="250" height="84" rx="14" fill="#2a9d8f" stroke="#1f6f64" stroke-width="1.4" data-card="1" data-cx="990" data-cy="232" data-w="250" data-h="84"/><text x="990" y="234.4" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="234">Trueque COMPLETADO</text><text x="990" y="250.2" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="234">ambos ✓ Conforme (sin disputa)</text><path d="M 712 232 L 865 232" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="770" y="222" font-size="10" font-weight="normal" fill="#1f6f64" text-anchor="middle" data-out="1">No</text><rect x="400" y="367" width="400" height="66" rx="14" fill="#f4a261" stroke="#b06a2a" stroke-width="1.4" data-card="1" data-cx="600" data-cy="400" data-w="400" data-h="66"/><text x="600" y="402.8" font-size="15" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="384">Disputa REPORTADA</text><text x="600" y="419.5" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="384">el trueque queda EN_DISPUTA</text><path d="M 600 298 L 600 367" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="612" y="336" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-out="1">Sí: con motivo + fotos</text><polygon points="600,460 705,520 600,580 495,520" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.6" data-card="1" data-cx="600" data-cy="520" data-hw="105" data-hh="60"/><text x="600" y="524.6" font-size="11.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="180">¿Qué dijo la otra parte?</text><path d="M 600 433 L 600 460" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><rect x="90" y="466" width="280" height="108" rx="14" fill="#f4a261" stroke="#b06a2a" stroke-width="1.4" data-card="1" data-cx="230" data-cy="520" data-w="280" data-h="108"/><text x="230" y="506.9" font-size="13.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="264">ESPERA_JUSTIFICATIVO</text><text x="230" y="523" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="264">la parte conforme sube fotos</text><text x="230" y="538.2" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="264">como justificativo</text><text x="230" y="552.9" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="264">plazo: 3 días</text><path d="M 495 520 L 370 520" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="438" y="512" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="middle" data-out="1">Ya estaba conforme</text><rect x="380" y="661" width="440" height="118" rx="14" fill="#d4af37" stroke="#8a6d1f" stroke-width="1.4" data-card="1" data-cx="600" data-cy="720" data-w="440" data-h="118"/><text x="600" y="708.3" font-size="16" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="424">EN_VOTACION</text><text x="600" y="725.9" font-size="11.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="424">votación de Socios · plazo: 5 días</text><text x="600" y="741.2" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="424">1 voto por Socio · las partes no votan</text><text x="600" y="755.9" font-size="10.5" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="424">ambas partes ya aportaron sus pruebas</text><path d="M 600 580 L 600 661" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="612" y="600" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-out="1">También No Conforme</text><text x="612" y="616" font-size="10.5" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-out="1">o no declaró nada</text><path d="M 350 574 L 350 630 L 560 630 L 560 661" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="360" y="615" font-size="10" font-weight="normal" fill="#1a2b4c" text-anchor="start" data-out="1">carga su justificativo</text><polygon points="600,839 718,905 600,971 482,905" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.6" data-card="1" data-cx="600" data-cy="905" data-hw="118" data-hh="66"/><text x="600" y="909.6" font-size="11.5" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="206">¿Qué votan los Socios?</text><path d="M 600 779 L 600 839" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><rect x="210" y="1038" width="380" height="104" rx="14" fill="#e63946" stroke="#8d1f2d" stroke-width="1.4" data-card="1" data-cx="400" data-cy="1090" data-w="380" data-h="104"/><text x="400" y="1078.6" font-size="15.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">VEREDICTO: ANULAR</text><text x="400" y="1095.5" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">trueque ANULADO · devolución total</text><text x="400" y="1110.2" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">cada parte recupera su objeto</text><text x="400" y="1124.7" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">estado final: RESUELTA</text><rect x="620" y="1038" width="380" height="104" rx="14" fill="#2a9d8f" stroke="#1f6f64" stroke-width="1.4" data-card="1" data-cx="810" data-cy="1090" data-w="380" data-h="104"/><text x="810" y="1078.6" font-size="15.5" font-weight="bold" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">VEREDICTO: VALIDO</text><text x="810" y="1095.5" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">trueque COMPLETADO · entrega en cruz</text><text x="810" y="1110.2" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">A recibe lo de B y B lo de A</text><text x="810" y="1124.7" font-size="10.5" font-weight="normal" fill="#ffffff" text-anchor="middle" data-in="1" data-mw="364">estado final: RESUELTA</text><path d="M 482 905 L 482 985 L 400 985 L 400 1038" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="392" y="1020" font-size="10" font-weight="bold" fill="#1a2b4c" text-anchor="end" data-out="1">ANULAR (mayoría)</text><path d="M 718 905 L 718 985 L 810 985 L 810 1038" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><text x="820" y="1020" font-size="10" font-weight="bold" fill="#1a2b4c" text-anchor="start" data-out="1">VALIDO (mayoría)</text><path d="M 600 971 L 600 1000 L 490 1000 L 490 1038" fill="none" stroke="#e63946" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrC)"/><text x="545" y="982" font-size="10" font-weight="normal" fill="#8d1f2d" text-anchor="middle" data-out="1">nadie vota o empate → ANULAR por defecto</text><path d="M 170 574 L 170 1090 L 210 1090" fill="none" stroke="#e63946" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrC)"/><text x="182" y="702" font-size="10" font-weight="normal" fill="#8d1f2d" text-anchor="start" data-out="1">no carga en 3 días</text><text x="182" y="718" font-size="10" font-weight="normal" fill="#8d1f2d" text-anchor="start" data-out="1">→ ANULAR por defecto</text><rect x="220" y="1198" width="760" height="74" rx="14" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.4" data-card="1" data-cx="600" data-cy="1235" data-w="760" data-h="74"/><text x="600" y="1237.1" font-size="14" font-weight="bold" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="744">Aviso del veredicto a ambas partes</text><text x="600" y="1253.4" font-size="11" font-weight="normal" fill="#0a1128" text-anchor="middle" data-in="1" data-mw="744">se notifica el resultado y su motivo (campana de avisos)</text><path d="M 400 1142 L 400 1198" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/><path d="M 810 1142 L 810 1198" fill="none" stroke="#1a2b4c" stroke-width="2.4" marker-end="url(#arrN)"/></svg>