<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2a9d8f"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#f8f9fa"/>
  <rect width="1200" height="58" fill="#1a2b4c"/>
  <rect y="54" width="1200" height="4" fill="#d4af37"/>
  <text x="600" y="37" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="bold">Certificarte con fotos: documento + selfie</text>

  <!-- A: foto documento -->
  <rect x="25" y="100" width="200" height="75" rx="13" fill="#f4a261" stroke="#b06a2a" stroke-width="1.2"/>
  <text x="125" y="133" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">1 · Foto del documento</text>
  <text x="125" y="155" text-anchor="middle" fill="#1a2b4c" font-size="10.5">DNI o cédula</text>

  <!-- B: selfie -->
  <rect x="260" y="100" width="180" height="75" rx="13" fill="#f4a261" stroke="#b06a2a" stroke-width="1.2"/>
  <text x="350" y="133" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">2 · Tu selfie</text>
  <text x="350" y="155" text-anchor="middle" fill="#1a2b4c" font-size="10.5">tu cara, de frente</text>

  <!-- C: vista previa -->
  <rect x="475" y="100" width="250" height="75" rx="13" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.2"/>
  <text x="600" y="133" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">3 · Revisa la vista previa</text>
  <text x="600" y="155" text-anchor="middle" fill="#1a2b4c" font-size="10.5">JPEG · PNG · WebP · máx. 4 MB</text>

  <!-- D: enviar -->
  <rect x="760" y="100" width="160" height="75" rx="13" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.2"/>
  <text x="840" y="133" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">4 · Enviar</text>
  <text x="840" y="155" text-anchor="middle" fill="#1a2b4c" font-size="10.5">queda PENDIENTE</text>

  <!-- E: owner revisa -->
  <rect x="955" y="100" width="220" height="75" rx="13" fill="#ffffff" stroke="#d4af37" stroke-width="1.5"/>
  <text x="1065" y="133" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">5 · El Owner revisa</text>
  <text x="1065" y="155" text-anchor="middle" fill="#1a2b4c" font-size="10.5">documento + selfie</text>

  <!-- arrows -->
  <line x1="229" y1="137" x2="256" y2="137" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="444" y1="137" x2="471" y2="137" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="729" y1="137" x2="756" y2="137" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="924" y1="137" x2="951" y2="137" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- rama aprobado -->
  <path d="M 1065 178 L 1065 215 L 765 215 L 765 246" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#arrG)"/>
  <text x="912" y="207" text-anchor="middle" fill="#2a9d8f" font-size="9.5" font-weight="bold">todo coincide ✓</text>

  <!-- rama rechazado -->
  <line x1="1105" y1="178" x2="1105" y2="246" stroke="#e63946" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="1115" y="213" fill="#e63946" font-size="9.5" font-weight="bold">algo no cuadra</text>

  <!-- APROBADO -->
  <rect x="610" y="250" width="310" height="80" rx="13" fill="#2a9d8f"/>
  <text x="765" y="282" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">APROBADO · CERTIFICADO</text>
  <text x="765" y="306" text-anchor="middle" fill="#e7f7f4" font-size="11">+ se te emite tu SBT nativo</text>

  <!-- RECHAZADO -->
  <rect x="945" y="250" width="230" height="80" rx="13" fill="#e63946"/>
  <text x="1060" y="282" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">RECHAZADO</text>
  <text x="1060" y="306" text-anchor="middle" fill="#ffe1e4" font-size="11">puedes volver a intentarlo</text>

  <!-- nota privacidad -->
  <rect x="25" y="250" width="545" height="80" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="297" y="279" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">Tus fotos estan a salvo</text>
  <text x="297" y="302" text-anchor="middle" fill="#1a2b4c" font-size="10">Solo pueden verlas tu cuenta y el Owner</text>
  <text x="297" y="318" text-anchor="middle" fill="#1a2b4c" font-size="10">huella digital contra alteraciones</text>

  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#e63946"/>
    </marker>
  </defs>
</svg>
