<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Disputa y anulacion con votos de Socios</text>

  <!-- D -->
  <rect x="240" y="80" width="320" height="56" rx="13" fill="#f4a261"/>
  <text x="400" y="106" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Objetos custodiados y surge un problema</text>
  <text x="400" y="123" text-anchor="middle" fill="#0a1128" font-size="10">alguien no cumple o quiere salirse</text>

  <!-- S: solicitar anulacion -->
  <rect x="240" y="175" width="320" height="62" rx="13" fill="#f4a261"/>
  <text x="400" y="199" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">1. Alguien solicita la anulacion</text>
  <text x="400" y="217" text-anchor="middle" fill="#0a1128" font-size="10.5">una sola vez por trueque · EN_DISPUTA</text>
  <text x="400" y="231" text-anchor="middle" fill="#0a1128" font-size="10">plazo: 5 dias</text>

  <!-- V: votacion -->
  <rect x="240" y="276" width="320" height="62" rx="13" fill="#1a2b4c"/>
  <text x="400" y="300" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">2. Los Socios votan</text>
  <text x="400" y="318" text-anchor="middle" fill="#f3e5ab" font-size="11">cada Socio vota una vez</text>
  <text x="400" y="333" text-anchor="middle" fill="#f3e5ab" font-size="10.5">quorum: 2 de 3 a favor</text>

  <!-- Outcomes -->
  <g>
    <rect x="60" y="400" width="320" height="70" rx="13" fill="#e2e8f0"/>
    <text x="220" y="424" text-anchor="middle" fill="#1a2b4c" font-size="11.5" font-weight="bold">3a. Si hay 2 de 3: se anula</text>
    <text x="220" y="442" text-anchor="middle" fill="#1a2b4c" font-size="10.5">cada uno recupera su objeto</text>
    <text x="220" y="458" text-anchor="middle" fill="#e63946" font-size="10" font-weight="bold">ANULADO</text>
  </g>
  <g>
    <rect x="420" y="400" width="320" height="70" rx="13" fill="#e2e8f0"/>
    <text x="580" y="424" text-anchor="middle" fill="#1a2b4c" font-size="11.5" font-weight="bold">3b. Si en 5 dias no hay quorum</text>
    <text x="580" y="442" text-anchor="middle" fill="#1a2b4c" font-size="10.5">resolucion por defecto:</text>
    <text x="580" y="458" text-anchor="middle" fill="#e63946" font-size="10" font-weight="bold">se anula igualmente</text>
  </g>

  <!-- Arrows -->
  <line x1="400" y1="138" x2="400" y2="171" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="400" y1="239" x2="400" y2="272" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M 340 340 L 220 396"/>
    <path d="M 460 340 L 580 396"/>
  </g>
  <text x="360" y="352" fill="#2a9d8f" font-size="11" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="3">si</text>
  <text x="440" y="352" fill="#e63946" font-size="9.5" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="3">no en 5 dias</text>

  <!-- Note -->
  <rect x="60" y="470" width="680" height="22" rx="8" fill="#f3e5ab"/>
  <text x="400" y="485" text-anchor="middle" fill="#0a1128" font-size="9" font-weight="bold">Observacion: hoy toda disputa termina en ANULADO (no existe "no se anula y sigue el trueque")</text>
</svg>
