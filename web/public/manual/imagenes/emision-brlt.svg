<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Que pasa cuando se emite BRLT</text>

  <!-- V: socios aprueban -->
  <rect x="200" y="80" width="400" height="58" rx="13" fill="#48cae4"/>
  <text x="400" y="106" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Los Socios aprueban emitir 100.000 BRLT</text>
  <text x="400" y="125" text-anchor="middle" fill="#0a1128" font-size="10.5">quorum: 2 de 3 votos a favor</text>

  <!-- M: moneda -->
  <rect x="200" y="180" width="400" height="70" rx="13" fill="#2a9d8f"/>
  <text x="400" y="206" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">La moneda BRLT comprueba</text>
  <text x="400" y="225" text-anchor="middle" fill="#ffffff" font-size="11">1. La orden viene del padron</text>
  <text x="400" y="241" text-anchor="middle" fill="#ffffff" font-size="11">2. El tope: no excede 1.000.000</text>

  <!-- Branch boxes -->
  <g>
    <rect x="60" y="320" width="200" height="100" rx="13" fill="#d4af37"/>
    <text x="160" y="352" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Fondo de Valor</text>
    <text x="160" y="374" text-anchor="middle" fill="#0a1128" font-size="11.5">5% = 5.000 BRLT</text>
    <text x="160" y="394" text-anchor="middle" fill="#0a1128" font-size="10.5">la hucha comun</text>
  </g>
  <g>
    <rect x="300" y="320" width="200" height="100" rx="13" fill="#1a2b4c"/>
    <text x="400" y="352" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">Destinatario</text>
    <text x="400" y="374" text-anchor="middle" fill="#f3e5ab" font-size="11.5">95% = 95.000 BRLT</text>
    <text x="400" y="394" text-anchor="middle" fill="#ffffff" font-size="10.5">recibe la emision</text>
  </g>
  <g>
    <rect x="540" y="320" width="200" height="100" rx="13" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
    <text x="640" y="352" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">Se registra</text>
    <text x="640" y="374" text-anchor="middle" fill="#1a2b4c" font-size="11">monto, proposito</text>
    <text x="640" y="394" text-anchor="middle" fill="#1a2b4c" font-size="11">y fecha</text>
  </g>

  <!-- Arrows -->
  <line x1="400" y1="140" x2="400" y2="176" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M 300 252 L 180 316"/>
    <line x1="400" y1="252" x2="400" y2="316"/>
    <path d="M 500 252 L 620 316"/>
  </g>
  <text x="330" y="176" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold">orden firmada</text>
  <text x="215" y="290" fill="#8a6d1f" font-size="10" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="3">5% (5.000)</text>
  <text x="400" y="290" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="3">95% (95.000)</text>
  <text x="565" y="290" fill="#1a2b4c" font-size="10" font-weight="bold" paint-order="stroke" stroke="#ffffff" stroke-width="3">registro</text>

  <!-- If rejected -->
  <rect x="200" y="448" width="400" height="36" rx="10" fill="#e63946"/>
  <text x="400" y="472" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Si 100.000 no caben en el tope, la emision se rechaza ("excede el tope")</text>
</svg>
