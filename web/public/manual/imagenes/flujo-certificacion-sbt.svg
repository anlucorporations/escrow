<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 425" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#e63946"/>
    </marker>
  </defs>
  <rect width="1200" height="425" fill="#f8f9fa"/>
  <rect width="1200" height="58" fill="#1a2b4c"/>
  <rect y="54" width="1200" height="4" fill="#d4af37"/>
  <text x="600" y="37" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="bold">Certificarte con SBT: la via rapida, paso a paso</text>

  <!-- A: VERIFICADO -->
  <rect x="25" y="95" width="230" height="70" rx="13" fill="#48cae4"/>
  <text x="140" y="126" text-anchor="middle" fill="#0a1128" font-size="14" font-weight="bold">VERIFICADO</text>
  <text x="140" y="148" text-anchor="middle" fill="#0a1128" font-size="10.5">ya confirmaste tu correo</text>

  <!-- Decision -->
  <polygon points="295,130 420,75 545,130 420,185" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.5"/>
  <text x="420" y="126" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">¿Tu wallet</text>
  <text x="420" y="143" text-anchor="middle" fill="#0a1128" font-size="12" font-weight="bold">tiene un SBT?</text>
  <text x="420" y="160" text-anchor="middle" fill="#0a1128" font-size="9.5">chequeo on-chain</text>

  <!-- C: pulsas certificarme -->
  <rect x="580" y="95" width="250" height="70" rx="13" fill="#1a2b4c"/>
  <text x="705" y="124" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Pulsas: Certificarme</text>
  <text x="705" y="145" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">automaticamente</text>

  <!-- F: CERTIFICADO al instante -->
  <rect x="900" y="95" width="275" height="70" rx="13" fill="#2a9d8f"/>
  <text x="1037" y="126" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="bold">CERTIFICADO</text>
  <text x="1037" y="148" text-anchor="middle" fill="#e7f7f4" font-size="10.5">al instante · tramite APROBADO</text>

  <line x1="257" y1="130" x2="291" y2="130" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="547" y1="130" x2="576" y2="130" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="562" y="119" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold">Sí ✓</text>
  <line x1="832" y1="130" x2="896" y2="130" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SBT externo -->
  <rect x="580" y="205" width="560" height="44" rx="11" fill="#f3e5ab" stroke="#c5a065" stroke-width="1.2"/>
  <text x="860" y="232" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">¿El SBT era externo? TrueKeate te emite su SBT nativo como credencial</text>
  <line x1="1037" y1="203" x2="1037" y2="169" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- No: vía con fotos -->
  <path d="M 420 188 L 420 225 L 175 225 L 175 246" fill="none" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="428" y="205" fill="#1a2b4c" font-size="10.5" font-weight="bold">No</text>

  <!-- E1: subir documento + selfie -->
  <rect x="25" y="250" width="300" height="70" rx="13" fill="#f4a261" stroke="#b06a2a" stroke-width="1.2"/>
  <text x="175" y="281" text-anchor="middle" fill="#1a2b4c" font-size="13.5" font-weight="bold">Subes documento + selfie</text>
  <text x="175" y="303" text-anchor="middle" fill="#1a2b4c" font-size="10.5">el tramite queda PENDIENTE</text>

  <!-- E2: Owner revisa -->
  <rect x="390" y="265" width="280" height="80" rx="13" fill="#ffffff" stroke="#d4af37" stroke-width="1.5"/>
  <text x="530" y="296" text-anchor="middle" fill="#1a2b4c" font-size="14" font-weight="bold">El Owner revisa</text>
  <text x="530" y="318" text-anchor="middle" fill="#1a2b4c" font-size="10.5">tus fotos en su Panel</text>

  <line x1="327" y1="285" x2="386" y2="285" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- E3a: CERTIFICADO + SBT -->
  <rect x="740" y="250" width="220" height="62" rx="12" fill="#2a9d8f"/>
  <text x="850" y="274" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">CERTIFICADO</text>
  <text x="850" y="296" text-anchor="middle" fill="#e7f7f4" font-size="10.5">+ se te emite tu SBT</text>

  <!-- E3b: RECHAZADO -->
  <rect x="740" y="330" width="220" height="62" rx="12" fill="#e63946"/>
  <text x="850" y="354" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RECHAZADO</text>
  <text x="850" y="376" text-anchor="middle" fill="#ffe1e4" font-size="10.5">puedes volver a intentarlo</text>

  <path d="M 672 287 C 700 287 700 281 734 281" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#arrG)"/>
  <text x="690" y="270" fill="#2a9d8f" font-size="9.5" font-weight="bold">Aprueba ✓</text>

  <path d="M 672 338 C 700 338 700 361 734 361" fill="none" stroke="#e63946" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="688" y="392" fill="#e63946" font-size="9.5" font-weight="bold">Rechaza ✗</text>
</svg>
