<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Conectar tu billetera con MetaMask</text>

  <!-- A -->
  <rect x="300" y="80" width="200" height="52" rx="13" fill="#48cae4"/>
  <text x="400" y="111" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Abres Mi Trueke Central</text>

  <!-- B decision -->
  <rect x="300" y="165" width="200" height="58" rx="13" fill="#f3e5ab" stroke="#c5a065" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">MetaMask</text>
  <text x="400" y="208" text-anchor="middle" fill="#0a1128" font-size="11.5">instalado?</text>

  <!-- C -->
  <rect x="300" y="258" width="200" height="52" rx="13" fill="#1a2b4c"/>
  <text x="400" y="289" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">Pulsas "Conectar MetaMask"</text>

  <!-- D -->
  <rect x="300" y="345" width="200" height="52" rx="13" fill="#2a9d8f"/>
  <text x="400" y="366" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">MetaMask pide permiso</text>
  <text x="400" y="383" text-anchor="middle" fill="#ffffff" font-size="10">para ver tus cuentas</text>

  <!-- N aviso -->
  <rect x="560" y="165" width="210" height="58" rx="13" fill="#e63946"/>
  <text x="665" y="190" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Aviso</text>
  <text x="665" y="208" text-anchor="middle" fill="#ffffff" font-size="10">instala MetaMask o</text>
  <text x="665" y="220" text-anchor="middle" fill="#ffffff" font-size="10">usa otra wallet</text>

  <!-- E conectado -->
  <rect x="560" y="300" width="210" height="80" rx="13" fill="#d4af37"/>
  <text x="665" y="326" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Conectado</text>
  <text x="665" y="346" text-anchor="middle" fill="#0a1128" font-size="10.5">tu direccion aparece</text>
  <text x="665" y="362" text-anchor="middle" fill="#0a1128" font-size="10.5">0x1234...abcd</text>

  <!-- F rechazas -->
  <rect x="30" y="330" width="190" height="70" rx="13" fill="#e2e8f0"/>
  <text x="125" y="356" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">Sigues sin conectar</text>
  <text x="125" y="374" text-anchor="middle" fill="#1a2b4c" font-size="10">puedes reintentar</text>

  <!-- G reconectar -->
  <rect x="560" y="410" width="210" height="60" rx="13" fill="#2a9d8f"/>
  <text x="665" y="434" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">Al refrescar la pagina</text>
  <text x="665" y="452" text-anchor="middle" fill="#ffffff" font-size="10.5">la app se reconecta sola</text>

  <!-- Arrows -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="400" y1="134" x2="400" y2="161"/>
    <!-- si -->
    <line x1="400" y1="225" x2="400" y2="254"/>
    <line x1="400" y1="312" x2="400" y2="341"/>
    <!-- no instalado -->
    <path d="M 502 194 L 556 194"/>
    <!-- aceptas -->
    <path d="M 502 371 L 556 350"/>
    <!-- rechazas -->
    <path d="M 298 365 L 224 368"/>
    <!-- reconexion -->
    <path d="M 665 382 L 665 406"/>
  </g>
  <text x="452" y="240" fill="#1a2b4c" font-size="11" font-weight="bold">si</text>
  <text x="529" y="185" fill="#1a2b4c" font-size="9.5">no</text>
  <text x="529" y="366" fill="#1a2b4c" font-size="10" font-weight="bold">aceptas</text>
  <text x="255" y="359" fill="#1a2b4c" font-size="10" font-weight="bold">rechazas</text>

  <!-- Note -->
  <rect x="40" y="430" width="440" height="50" rx="12" fill="#0a1128"/>
  <text x="260" y="449" text-anchor="middle" fill="#f3e5ab" font-size="10.5" font-weight="bold">Si cambias de cuenta dentro de MetaMask, la app</text>
  <text x="260" y="465" text-anchor="middle" fill="#ffffff" font-size="10.5">se entera al momento (aviso accountsChanged)</text>
</svg>
