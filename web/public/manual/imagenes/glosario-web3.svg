<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Glosario: Web3 en 30 segundos</text>

  <!-- Center -->
  <circle cx="400" cy="255" r="62" fill="#1a2b4c" stroke="#d4af37" stroke-width="4"/>
  <text x="400" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Web3</text>
  <text x="400" y="264" text-anchor="middle" fill="#f3e5ab" font-size="10.5">en 30 segundos</text>

  <!-- Connectors -->
  <g stroke="#1a2b4c" stroke-width="2">
    <line x1="345" y1="215" x2="220" y2="130"/>
    <line x1="455" y1="215" x2="580" y2="130"/>
    <line x1="340" y1="255" x2="215" y2="255"/>
    <line x1="460" y1="255" x2="585" y2="255"/>
    <line x1="345" y1="295" x2="220" y2="380"/>
    <line x1="455" y1="295" x2="580" y2="380"/>
  </g>

  <!-- Left column -->
  <g>
    <rect x="40" y="70" width="180" height="120" rx="14" fill="#e63946"/>
    <text x="130" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Blockchain</text>
    <text x="130" y="122" text-anchor="middle" fill="#ffffff" font-size="10">Registro publico</text>
    <text x="130" y="138" text-anchor="middle" fill="#ffffff" font-size="10">No se puede borrar</text>
    <text x="130" y="154" text-anchor="middle" fill="#ffffff" font-size="10">Fuente de verdad</text>
    <text x="130" y="170" text-anchor="middle" fill="#f3e5ab" font-size="10">del escrow</text>
  </g>
  <g>
    <rect x="40" y="215" width="180" height="80" rx="14" fill="#48cae4"/>
    <text x="130" y="242" text-anchor="middle" fill="#0a1128" font-size="14" font-weight="bold">Billetera</text>
    <text x="130" y="262" text-anchor="middle" fill="#0a1128" font-size="10">Guarda tus claves</text>
    <text x="130" y="278" text-anchor="middle" fill="#0a1128" font-size="10">MetaMask · firma</text>
  </g>
  <g>
    <rect x="40" y="330" width="180" height="120" rx="14" fill="#d4af37"/>
    <text x="130" y="360" text-anchor="middle" fill="#0a1128" font-size="14" font-weight="bold">Token / NFT</text>
    <text x="130" y="382" text-anchor="middle" fill="#0a1128" font-size="10">Cripto (BRLT)</text>
    <text x="130" y="398" text-anchor="middle" fill="#0a1128" font-size="10">Certificado digital</text>
    <text x="130" y="414" text-anchor="middle" fill="#0a1128" font-size="10">unico de un objeto</text>
  </g>

  <!-- Right column -->
  <g>
    <rect x="580" y="70" width="180" height="120" rx="14" fill="#2a9d8f"/>
    <text x="670" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Contrato inteligente</text>
    <text x="670" y="122" text-anchor="middle" fill="#ffffff" font-size="10">Programa en la cadena</text>
    <text x="670" y="138" text-anchor="middle" fill="#ffffff" font-size="10">Cumple sus reglas solo</text>
    <text x="670" y="154" text-anchor="middle" fill="#ffffff" font-size="10">Escrow, SmartAccount</text>
  </g>
  <g>
    <rect x="580" y="215" width="180" height="80" rx="14" fill="#f4a261"/>
    <text x="670" y="242" text-anchor="middle" fill="#0a1128" font-size="14" font-weight="bold">Gas</text>
    <text x="670" y="262" text-anchor="middle" fill="#0a1128" font-size="10">Peaje de la red</text>
    <text x="670" y="278" text-anchor="middle" fill="#0a1128" font-size="10">Lo paga el relayer</text>
  </g>
  <g>
    <rect x="580" y="330" width="180" height="120" rx="14" fill="#48cae4"/>
    <text x="670" y="360" text-anchor="middle" fill="#0a1128" font-size="14" font-weight="bold">On-chain / Off-chain</text>
    <text x="670" y="382" text-anchor="middle" fill="#0a1128" font-size="10">On-chain: estados y</text>
    <text x="670" y="398" text-anchor="middle" fill="#0a1128" font-size="10">custodia en la cadena</text>
    <text x="670" y="414" text-anchor="middle" fill="#0a1128" font-size="10">Off-chain: chat, fotos</text>
  </g>

  <!-- Top/bottom small chips -->
  <rect x="250" y="90" width="0" height="0" fill="none"/>
  <text x="400" y="86" text-anchor="middle" fill="#1a2b4c" font-size="10">La fuente de verdad del trueque esta on-chain</text>
  <rect x="250" y="452" width="300" height="30" rx="15" fill="#1a2b4c"/>
  <text x="400" y="472" text-anchor="middle" fill="#f3e5ab" font-size="11" font-weight="bold">La cadena decide · la base de datos ayuda</text>
</svg>
