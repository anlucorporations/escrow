<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2a9d8f"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Conecta tu billetera a la red RPC de TrueKeate</text>

  <!-- Contenedor: Tu dispositivo -->
  <rect x="30" y="72" width="310" height="380" rx="16" fill="#ffffff" stroke="#48cae4" stroke-width="2"/>
  <rect x="45" y="80" width="280" height="30" rx="8" fill="#48cae4"/>
  <text x="185" y="100" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">TU DISPOSITIVO</text>

  <!-- MetaMask -->
  <rect x="55" y="130" width="270" height="92" rx="13" fill="#1a2b4c"/>
  <text x="190" y="160" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">MetaMask</text>
  <text x="190" y="182" text-anchor="middle" fill="#ffffff" font-size="11">tu billetera (extensión o app)</text>
  <text x="190" y="200" text-anchor="middle" fill="#f3e5ab" font-size="10.5">guarda tus claves y firma por ti</text>

  <!-- Web TrueKeate -->
  <rect x="55" y="330" width="270" height="92" rx="13" fill="#2a9d8f"/>
  <text x="190" y="360" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Web de TrueKeate</text>
  <text x="190" y="382" text-anchor="middle" fill="#ffffff" font-size="11">navegador (window.ethereum)</text>
  <text x="190" y="400" text-anchor="middle" fill="#ffffff" font-size="10.5">pide conectar para ver tus cuentas</text>

  <!-- Contenedor: Nube de Google -->
  <rect x="460" y="72" width="310" height="380" rx="16" fill="#ffffff" stroke="#d4af37" stroke-width="2"/>
  <rect x="475" y="80" width="280" height="30" rx="8" fill="#d4af37"/>
  <text x="615" y="100" text-anchor="middle" fill="#0a1128" font-size="13" font-weight="bold">NUBE DE GOOGLE</text>

  <!-- Anvil RPC -->
  <rect x="475" y="130" width="270" height="92" rx="13" fill="#f4a261"/>
  <text x="610" y="156" text-anchor="middle" fill="#0a1128" font-size="13.5" font-weight="bold">Anvil / Foundry remoto</text>
  <text x="610" y="178" text-anchor="middle" fill="#0a1128" font-size="11">blockchain de pruebas (RPC)</text>
  <text x="610" y="196" text-anchor="middle" fill="#0a1128" font-size="10.5">cadena 31337 · ETH simbólico</text>
  <text x="610" y="213" text-anchor="middle" fill="#0a1128" font-size="10.5">contratos: Escrow, BRLT, NFTs</text>

  <!-- Relayer -->
  <rect x="475" y="330" width="270" height="92" rx="13" fill="#2a9d8f"/>
  <text x="610" y="360" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Relayer de la plataforma</text>
  <text x="610" y="382" text-anchor="middle" fill="#ffffff" font-size="11">cuenta 1 · billetera del servidor</text>
  <text x="610" y="400" text-anchor="middle" fill="#ffffff" font-size="10.5">paga el gas de los trueques por ti</text>

  <!-- Flechas dispositivo -> anvil -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="325" y1="160" x2="471" y2="160"/>
    <line x1="325" y1="195" x2="471" y2="195"/>
    <line x1="325" y1="360" x2="471" y2="360"/>
  </g>
  <text x="400" y="152" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold">1 · añadir red manualmente</text>
  <text x="400" y="187" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold">3 · firma sesión y trueques</text>
  <text x="400" y="352" text-anchor="middle" fill="#1a2b4c" font-size="10" font-weight="bold">2 · lee contratos y saldos</text>

  <!-- Flecha relayer -> anvil (dentro de la nube) -->
  <g stroke="#2a9d8f" stroke-width="2.5" fill="none" marker-end="url(#arrT)">
    <line x1="610" y1="330" x2="610" y2="226"/>
  </g>
  <text x="622" y="280" fill="#1a2b4c" font-size="10" font-weight="bold">4 · paga el gas por ti</text>

  <!-- Conexion MetaMask <-> Web -->
  <g stroke="#8d86a9" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arr)">
    <line x1="190" y1="226" x2="190" y2="326"/>
  </g>
  <text x="205" y="282" fill="#1a2b4c" font-size="9.5">la web lee tu billetera</text>

  <!-- Nota datos RPC -->
  <rect x="30" y="458" width="740" height="38" rx="10" fill="#0a1128"/>
  <text x="400" y="475" text-anchor="middle" fill="#f3e5ab" font-size="11" font-weight="bold">RPC: https://mcc-foundry-anvil-slzlptbcla-ew.a.run.app · Chain ID 31337 · Moneda: ETH</text>
  <text x="400" y="491" text-anchor="middle" fill="#ffffff" font-size="10">La red se añade UNA sola vez a mano; la plataforma no cambia tu red por ti</text>
</svg>
