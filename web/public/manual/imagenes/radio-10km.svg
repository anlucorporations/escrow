<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">La regla de los 10 km (PostGIS)</text>

  <!-- Circle -->
  <circle cx="400" cy="255" r="140" fill="#e6f4f2" opacity="0.35" stroke="#2a9d8f" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="400" y="102" text-anchor="middle" fill="#1f6f64" font-size="11" font-weight="bold">menos de 10.000 m (10 km)</text>
  <text x="400" y="118" text-anchor="middle" fill="#1f6f64" font-size="10">PostGIS: ST_DWithin(..., 10000)</text>

  <!-- Center point (map pin) -->
  <path d="M 400 185 L 428 213 L 428 248 L 400 278 L 372 248 L 372 213 Z" fill="#d4af37" stroke="#8a6d1f" stroke-width="1.5"/>
  <circle cx="400" cy="248" r="11" fill="#d4af37"/>
  <circle cx="400" cy="248" r="5" fill="#0a1128"/>
  <rect x="325" y="305" width="150" height="28" rx="10" fill="#d4af37"/>
  <text x="400" y="324" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">Punto de encuentro</text>

  <!-- Ana inside -->
  <rect x="60" y="195" width="150" height="58" rx="12" fill="#f4a261"/>
  <text x="135" y="219" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Ana</text>
  <text x="135" y="237" text-anchor="middle" fill="#0a1128" font-size="9.5">su direccion de inscripcion</text>

  <!-- Bruno inside -->
  <rect x="590" y="250" width="150" height="58" rx="12" fill="#f4a261"/>
  <text x="665" y="274" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">Bruno</text>
  <text x="665" y="292" text-anchor="middle" fill="#0a1128" font-size="9.5">su direccion de inscripcion</text>

  <!-- Distance lines inside -->
  <g stroke="#8a6d1f" stroke-width="2" stroke-dasharray="4 4">
    <line x1="212" y1="230" x2="368" y2="240"/>
    <line x1="588" y1="278" x2="432" y2="253"/>
  </g>
  <text x="238" y="222" fill="#8a6d1f" font-size="9.5" font-weight="bold">menos de 10 km</text>
  <text x="470" y="285" fill="#8a6d1f" font-size="9.5" font-weight="bold">menos de 10 km</text>

  <!-- Someone far (outside) -->
  <circle cx="715" cy="140" r="22" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
  <text x="715" y="146" text-anchor="middle" fill="#1a2b4c" font-size="11" font-weight="bold">C</text>
  <text x="650" y="120" fill="#1a2b4c" font-size="9.5">a mas de 10 km</text>
  <line x1="560" y1="180" x2="700" y2="145" stroke="#8d86a9" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- Outcomes -->
  <rect x="80" y="380" width="300" height="58" rx="12" fill="#2a9d8f"/>
  <text x="230" y="406" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">Trueque viable</text>
  <text x="230" y="425" text-anchor="middle" fill="#ffffff" font-size="10">todos a menos de 10 km</text>

  <rect x="470" y="380" width="300" height="58" rx="12" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
  <text x="620" y="406" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">Trueque no viable</text>
  <text x="620" y="425" text-anchor="middle" fill="#1a2b4c" font-size="10">se sugieren otros puntos</text>

  <!-- Arrows from pin to outcomes -->
  <g stroke="#1a2b4c" stroke-width="2" fill="none" marker-end="url(#arrM)">
    <line x1="400" y1="335" x2="255" y2="376"/>
    <line x1="400" y1="335" x2="575" y2="376"/>
    <!-- far person -> no viable -->
    <path d="M 720 165 L 660 376"/>
  </g>

  <!-- Note -->
  <rect x="60" y="462" width="680" height="26" rx="10" fill="#1a2b4c"/>
  <text x="400" y="480" text-anchor="middle" fill="#f3e5ab" font-size="10.5" font-weight="bold">Sirve para sugerir encuentros cercanos, filtrar ofertas y buscar establecimientos de retiro</text>
</svg>
