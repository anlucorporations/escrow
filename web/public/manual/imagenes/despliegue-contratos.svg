<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Despliegue de contratos paso a paso</text>

  <!-- Main column steps -->
  <g>
    <rect x="60" y="80" width="440" height="52" rx="13" fill="#f4a261"/>
    <text x="84" y="112" fill="#0a1128" font-size="12.5" font-weight="bold">1. Encender anvil</text>
    <text x="520" y="112" text-anchor="end" fill="#0a1128" font-size="10.5">blockchain de pruebas, red 31337</text>
  </g>
  <line x1="280" y1="134" x2="280" y2="150" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <g>
    <rect x="60" y="156" width="440" height="52" rx="13" fill="#48cae4"/>
    <text x="84" y="188" fill="#0a1128" font-size="12.5" font-weight="bold">2. Ejecutar el guion de despliegue</text>
    <text x="520" y="188" text-anchor="end" fill="#0a1128" font-size="10.5">forge script Deploy.s.sol</text>
  </g>
  <line x1="280" y1="210" x2="280" y2="226" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <g>
    <rect x="60" y="232" width="440" height="58" rx="13" fill="#2a9d8f"/>
    <text x="84" y="256" fill="#ffffff" font-size="12.5" font-weight="bold">3. Se crean las piezas</text>
    <text x="84" y="276" fill="#ffffff" font-size="10.5">Escrow · Factory de cuentas · tokens de prueba · BRLT</text>
    <text x="84" y="288" fill="#ffffff" font-size="9.5">Fondo de Valor · Padron de Socios · Suscripcion</text>
  </g>
  <line x1="280" y1="292" x2="280" y2="308" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <g>
    <rect x="60" y="314" width="440" height="52" rx="13" fill="#2a9d8f"/>
    <text x="84" y="340" fill="#ffffff" font-size="12.5" font-weight="bold">4. Se conectan las piezas entre si</text>
    <text x="84" y="357" fill="#ffffff" font-size="10.5">moneda con fondo · padron con moneda · escrow ...</text>
  </g>
  <line x1="280" y1="368" x2="280" y2="384" stroke="#1a2b4c" stroke-width="2.5" marker-end="url(#arr)"/>
  <g>
    <rect x="60" y="390" width="440" height="52" rx="13" fill="#d4af37"/>
    <text x="84" y="416" fill="#0a1128" font-size="12.5" font-weight="bold">5. Se anotan las direcciones</text>
    <text x="84" y="432" fill="#0a1128" font-size="10.5">broadcast/ · mapa de contratos</text>
  </g>

  <!-- Branches right -->
  <g>
    <rect x="600" y="170" width="170" height="100" rx="13" fill="#e2e8f0"/>
    <text x="685" y="198" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">6. Actualizar el</text>
    <text x="685" y="216" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">mapa de contratos</text>
    <text x="685" y="238" text-anchor="middle" fill="#1a2b4c" font-size="10.5">del backend</text>
    <text x="685" y="256" text-anchor="middle" fill="#1a2b4c" font-size="10">para que el vigilante</text>
    <text x="685" y="269" text-anchor="middle" fill="#1a2b4c" font-size="10">sepa donde escuchar</text>
  </g>
  <g>
    <rect x="600" y="330" width="170" height="90" rx="13" fill="#e2e8f0"/>
    <text x="685" y="356" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">7. Actualizar</text>
    <text x="685" y="374" text-anchor="middle" fill="#1a2b4c" font-size="12" font-weight="bold">direcciones</text>
    <text x="685" y="396" text-anchor="middle" fill="#1a2b4c" font-size="10.5">de la app web</text>
  </g>
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M 502 300 L 560 300 L 560 220 L 596 220"/>
    <path d="M 502 416 L 560 416 L 560 375 L 596 375"/>
  </g>

  <!-- Note -->
  <rect x="60" y="460" width="710" height="26" rx="10" fill="#f3e5ab"/>
  <text x="415" y="478" text-anchor="middle" fill="#0a1128" font-size="10.5" font-weight="bold">Pendiente de confirmar: el guion aun no conecta el Escrow con el Padron de Socios (se espera en un guion posterior)</text>
</svg>
