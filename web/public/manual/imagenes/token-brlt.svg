<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#e63946"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8f9fa"/>
  <rect width="800" height="54" fill="#1a2b4c"/>
  <rect y="50" width="800" height="4" fill="#d4af37"/>
  <text x="400" y="34" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Añade el token BRLT a tu billetera (red de pruebas)</text>

  <!-- Paso 1 -->
  <rect x="200" y="60" width="400" height="40" rx="12" fill="#f4a261"/>
  <text x="400" y="86" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">1 · Red de TrueKeate seleccionada (31337)</text>

  <!-- Paso 2 -->
  <rect x="200" y="112" width="400" height="40" rx="12" fill="#48cae4"/>
  <text x="400" y="138" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">2 · Pestaña «Activos» → «Importar tokens»</text>

  <!-- Paso 3 -->
  <rect x="200" y="164" width="400" height="48" rx="12" fill="#48cae4"/>
  <text x="400" y="184" text-anchor="middle" fill="#0a1128" font-size="11.5" font-weight="bold">3 · Pestaña «Token personalizado»: pega la dirección</text>
  <text x="400" y="203" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">0x6f6f570f45833e249e27022648a26f4076f48f78</text>

  <!-- Paso 4 -->
  <rect x="200" y="224" width="400" height="40" rx="12" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1.5"/>
  <text x="400" y="250" text-anchor="middle" fill="#1a2b4c" font-size="12.5" font-weight="bold">4 · MetaMask rellena solo: símbolo BRLT · 18 decimales</text>

  <!-- Paso 5 -->
  <rect x="200" y="276" width="400" height="40" rx="12" fill="#48cae4"/>
  <text x="400" y="302" text-anchor="middle" fill="#0a1128" font-size="12.5" font-weight="bold">5 · «Añadir token personalizado» → «Importar»</text>

  <!-- Paso 6 -->
  <rect x="200" y="328" width="400" height="40" rx="12" fill="#2a9d8f"/>
  <text x="400" y="354" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">6 · BRLT aparece en «Activos» con su saldo</text>

  <!-- Decision -->
  <rect x="200" y="380" width="400" height="48" rx="12" fill="#d4af37"/>
  <text x="400" y="409" text-anchor="middle" fill="#0a1128" font-size="13.5" font-weight="bold">¿El saldo aparece en 0?</text>

  <!-- No: listo -->
  <rect x="100" y="444" width="280" height="50" rx="12" fill="#2a9d8f"/>
  <text x="240" y="466" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">No → ¡Listo!</text>
  <text x="240" y="485" text-anchor="middle" fill="#ffffff" font-size="10.5">ya ves tu BRLT de la red de pruebas</text>

  <!-- Si: saldo 0, comprobar -->
  <rect x="420" y="444" width="280" height="50" rx="12" fill="#e63946"/>
  <text x="560" y="462" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">Sí → saldo en 0: comprueba</text>
  <text x="560" y="478" text-anchor="middle" fill="#ffffff" font-size="9.5">la cuenta activa y la red 31337;</text>
  <text x="560" y="490" text-anchor="middle" fill="#ffffff" font-size="9.5">¿los Socios ya emitieron BRLT?</text>

  <!-- Flechas verticales -->
  <g stroke="#1a2b4c" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="400" y1="100" x2="400" y2="108"/>
    <line x1="400" y1="152" x2="400" y2="160"/>
    <line x1="400" y1="212" x2="400" y2="220"/>
    <line x1="400" y1="264" x2="400" y2="272"/>
    <line x1="400" y1="316" x2="400" y2="324"/>
    <line x1="400" y1="368" x2="400" y2="376"/>
    <line x1="240" y1="428" x2="240" y2="440"/>
    <line x1="560" y1="428" x2="560" y2="440"/>
  </g>
  <text x="252" y="442" fill="#0a1128" font-size="11" font-weight="bold">no</text>
  <text x="572" y="442" fill="#0a1128" font-size="11" font-weight="bold">sí</text>

  <!-- Bucle: saldo 0 -> volver a importar (paso 5) -->
  <g stroke="#e63946" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)">
    <path d="M 660 444 L 660 296 L 603 296"/>
  </g>
  <text x="672" y="386" fill="#e63946" font-size="10" font-weight="bold">vuelve al paso 5</text>
</svg>
