<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a2b4c"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#f8f9fa"/>
  <rect width="1200" height="58" fill="#1a2b4c"/>
  <rect y="54" width="1200" height="4" fill="#d4af37"/>
  <text x="600" y="37" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="bold">Reinicio limpio y alta del Owner (bootstrap)</text>

  <!-- 1 · Diagnóstico -->
  <rect x="16" y="110" width="168" height="120" rx="13" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1"/>
  <text x="100" y="141" text-anchor="middle" fill="#1a2b4c" font-size="11.5" font-weight="bold">1 · Diagnóstico</text>
  <text x="100" y="164" text-anchor="middle" fill="#1a2b4c" font-size="9">--check</text>
  <text x="100" y="181" text-anchor="middle" fill="#1a2b4c" font-size="9">solo mira, no borra</text>

  <!-- 2 · Respaldo -->
  <rect x="216" y="110" width="168" height="120" rx="13" fill="#e9e5f0" stroke="#8d86a9" stroke-width="1"/>
  <text x="300" y="141" text-anchor="middle" fill="#1a2b4c" font-size="11.5" font-weight="bold">2 · Respaldo</text>
  <text x="300" y="164" text-anchor="middle" fill="#1a2b4c" font-size="9">(opcional) --respaldo</text>
  <text x="300" y="181" text-anchor="middle" fill="#1a2b4c" font-size="9">copia previa en backups/</text>

  <!-- 3 · Limpiar base -->
  <rect x="416" y="110" width="168" height="120" rx="13" fill="#e63946"/>
  <text x="500" y="141" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">3 · Limpiar la base</text>
  <text x="500" y="164" text-anchor="middle" fill="#ffe4e7" font-size="9">--confirmar</text>
  <text x="500" y="181" text-anchor="middle" fill="#ffe4e7" font-size="9">te pide escribir BORRAR</text>

  <!-- 4 · Alta del Owner -->
  <rect x="616" y="110" width="168" height="120" rx="13" fill="#2a9d8f"/>
  <text x="700" y="141" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">4 · Alta del Owner</text>
  <text x="700" y="164" text-anchor="middle" fill="#dcf4f0" font-size="9">bootstrap --confirmar</text>
  <text x="700" y="181" text-anchor="middle" fill="#dcf4f0" font-size="9">--smart-account</text>

  <!-- 5 · Verificar -->
  <rect x="816" y="110" width="168" height="120" rx="13" fill="#f3e5ab" stroke="#c5a065" stroke-width="1"/>
  <text x="900" y="141" text-anchor="middle" fill="#1a2b4c" font-size="11.5" font-weight="bold">5 · Verifica el Panel</text>
  <text x="900" y="164" text-anchor="middle" fill="#1a2b4c" font-size="9">/suite/admin</text>
  <text x="900" y="181" text-anchor="middle" fill="#1a2b4c" font-size="9">Owner CERTIFICADO · SOCIO</text>

  <!-- 6 · Indexador -->
  <rect x="1016" y="110" width="168" height="120" rx="13" fill="#48cae4"/>
  <text x="1100" y="141" text-anchor="middle" fill="#0a1128" font-size="11" font-weight="bold">6 · Indexador</text>
  <text x="1100" y="164" text-anchor="middle" fill="#0a1128" font-size="9">--watch</text>
  <text x="1100" y="181" text-anchor="middle" fill="#0a1128" font-size="9">rellena el espejo</text>

  <!-- arrows -->
  <line x1="188" y1="170" x2="210" y2="170" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="388" y1="170" x2="410" y2="170" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="588" y1="170" x2="610" y2="170" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="788" y1="170" x2="810" y2="170" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="988" y1="170" x2="1010" y2="170" stroke="#1a2b4c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- nota de seguridad -->
  <rect x="130" y="292" width="940" height="52" rx="12" fill="#fdf3e0" stroke="#d4af37" stroke-width="1.5"/>
  <text x="600" y="323" text-anchor="middle" fill="#1a2b4c" font-size="11.5">⚠ Borran datos: empieza siempre con --check · conviene --respaldo antes · la cadena (anvil) no se toca</text>
</svg>
